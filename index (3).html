<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 시작 페이지</title>
<style>
  :root {
    --paper: #F6F3EC;
    --paper-deep: #EFEAE0;
    --ink: #2B2A28;
    --ink-soft: #6B6660;
    --accent: #2C3E50;
    --accent-soft: #4A5F72;
    --line: #DAD4C6;
    --done: #A8A296;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8vh 24px 60px;
  }

  .clock-block {
    text-align: center;
    margin-bottom: 48px;
  }

  .date {
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }

  .time {
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .search-form {
    width: 100%;
    max-width: 560px;
    display: flex;
    gap: 10px;
    margin-bottom: 56px;
  }

  .search-input {
    flex: 1;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: #FFFFFF;
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-input:focus {
    border-color: var(--accent-soft);
  }

  .search-btn {
    padding: 14px 22px;
    border: none;
    border-radius: 24px;
    background: var(--accent);
    color: var(--paper);
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .search-btn:hover {
    background: var(--accent-soft);
  }

  .todo-card {
    width: 100%;
    max-width: 460px;
    background: var(--paper-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px 24px 18px;
  }

  .todo-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }

  .todo-title {
    font-family: Georgia, "Noto Serif KR", serif;
    font-size: 1.15rem;
    margin: 0;
    color: var(--ink);
  }

  .todo-count {
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  .todo-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .todo-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #FFFFFF;
    font-size: 0.92rem;
    color: var(--ink);
    outline: none;
  }

  .todo-input:focus {
    border-color: var(--accent-soft);
  }

  .todo-add {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--paper);
    font-size: 0.9rem;
    cursor: pointer;
  }

  .todo-add:hover {
    background: var(--accent-soft);
  }

  .todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--line);
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  .todo-item input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .todo-text {
    flex: 1;
    font-size: 0.94rem;
    color: var(--ink);
    word-break: break-word;
  }

  .todo-item.done .todo-text {
    text-decoration: line-through;
    color: var(--done);
  }

  .todo-delete {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }

  .todo-delete:hover {
    color: var(--accent);
  }

  .todo-empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.88rem;
    padding: 14px 0 6px;
  }
</style>
</head>
<body>

  <div class="clock-block">
    <p class="date" id="date"></p>
    <p class="time" id="time"></p>
  </div>

  <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET">
    <input
      type="text"
      class="search-input"
      id="searchInput"
      name="q"
      placeholder="Google 검색"
      autocomplete="off"
      autofocus
    >
    <button type="submit" class="search-btn">검색</button>
  </form>

  <div class="todo-card">
    <div class="todo-header">
      <h2 class="todo-title">오늘의 할 일</h2>
      <span class="todo-count" id="todoCount"></span>
    </div>
    <form class="todo-form" id="todoForm">
      <input
        type="text"
        class="todo-input"
        id="todoInput"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
      >
      <button type="submit" class="todo-add">추가</button>
    </form>
    <ul class="todo-list" id="todoList"></ul>
  </div>

<script>
  // 날짜 / 시간
  const dateEl = document.getElementById('date');
  const timeEl = document.getElementById('time');
  const days = ['일', '월', '화', '수', '목', '금', '토'];

  function updateClock() {
    const now = new Date();
    dateEl.textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    timeEl.textContent = `${h}:${m}:${s}`;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // 할 일 목록 (localStorage 저장)
  const todoForm = document.getElementById('todoForm');
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  const todoCount = document.getElementById('todoCount');

  const STORAGE_KEY = 'myHomepage.todos';
  let todos = [];

  function loadTodos() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      todos = saved ? JSON.parse(saved) : [];
    } catch (err) {
      todos = [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function renderTodos() {
    todoList.innerHTML = '';

    if (todos.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'todo-empty';
      empty.textContent = '할 일이 없습니다. 새로 추가해 보세요.';
      todoList.appendChild(empty);
    } else {
      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          todos[index].done = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'todo-delete';
        deleteBtn.textContent = '×';
        deleteBtn.setAttribute('aria-label', '삭제');
        deleteBtn.addEventListener('click', () => {
          todos.splice(index, 1);
          saveTodos();
          renderTodos();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(deleteBtn);
        todoList.appendChild(li);
      });
    }

    const doneCount = todos.filter(t => t.done).length;
    todoCount.textContent = todos.length ? `${doneCount} / ${todos.length} 완료` : '';
  }

  todoForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    saveTodos();
    todoInput.value = '';
    renderTodos();
  });

  loadTodos();
  renderTodos();
</script>

</body>
</html>
