<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영수증 정리 도우미 2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mu:#6b7385;--bd:#e3e7ef;--ac:#1e40af;--mt:#14b8a6;--ac2:#e6edff;--up:#dc2626;--dn:#059669;--nv:#0f2747;color-scheme:light}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--card:#1a202b;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3442;--ac:#6b9bff;--ac2:#243252;--up:#ff7a7a;--dn:#34d399;--nv:#0b1a30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--card:#1a202b;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#2c3442;--ac:#6b9bff;--ac2:#243252;--up:#ff7a7a;--dn:#34d399;--nv:#0b1a30;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
nav{position:fixed;z-index:4;left:0;right:0;bottom:0;background:var(--nv);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav a{color:#c9d6ee;cursor:pointer;display:flex;flex-direction:column;align-items:center;flex:1;font-size:10px;padding:4px 0;border-radius:10px}
nav a b{font-size:18px;font-weight:400}nav a.on{background:rgba(20,184,166,.25);color:#fff}.lo{display:none}.sl{display:inline}.l{display:none}
#mn{padding:14px 14px 90px;max-width:1040px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}h1{font-size:20px;margin:6px 0}h2{font-size:15px;margin:0 0 10px}
@media(min-width:800px){nav{right:auto;top:0;width:200px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(18px + env(safe-area-inset-top,0px)) 10px 10px}nav a{flex-direction:row;gap:10px;font-size:14px;padding:10px 12px;flex:none}.lo{display:block;color:#fff;font-weight:700;font-size:16px;margin:0 6px 14px}.l{display:inline}.sl{display:none}#mn{margin:0 0 0 200px;max-width:none;padding:22px 28px 30px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 1px 4px rgba(15,39,71,.06);animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.k{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.sc .v{font-size:18px;font-weight:700;margin-top:2px}.sc{transition:transform .2s}.sc:hover{transform:translateY(-2px)}
.mu{color:var(--mu)}.s{font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}input[type=checkbox]{width:auto}
input.bad,select.bad{border-color:var(--up);background:rgba(220,38,38,.08)}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
button{font:inherit;padding:8px 13px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.dg{color:var(--up)}button:disabled{opacity:.5}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.c{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}.vb{display:flex;gap:3px}.vb b{font-size:10px;font-weight:500;color:var(--mu);height:14px;white-space:nowrap}.vb small{font-size:10px;color:var(--mu);height:14px}
.bw{height:110px;width:100%;display:flex;align-items:flex-end}.bw i{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:1px}
.br{display:grid;grid-template-columns:120px 1fr 100px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.br b{text-align:right}.br span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{background:var(--ac2);border-radius:6px;height:12px}.tr i{display:block;height:100%;background:var(--mt);border-radius:6px;transition:width .4s}.tr i.y{background:#f59e0b}.tr i.o{background:#f97316}.tr i.r{background:#dc2626}
.yt{color:#b45309}.ot{color:#c2410c}.rt{color:var(--up);font-weight:700}
.dn2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.lg div{margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.em{text-align:center;padding:26px 10px;color:var(--mu)}.em div{margin:8px 0}
.it{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.it .m{flex:1 1 180px}.act{white-space:nowrap}.act button{padding:4px 9px;font-size:12px}.n{text-align:right}
@media(min-width:800px){.it{display:grid;grid-template-columns:24px 90px 1fr 100px 110px 120px}}
.tag{font-size:10px;background:var(--ac2);color:var(--ac);padding:1px 5px;border-radius:6px}.ck{display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)}
.cr{display:flex;gap:8px;align-items:center;margin:6px 0}.cr .gr{flex:1}.bi{margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;display:none;max-width:90%;z-index:6}
</style></head><body>
<nav id="nv"></nav><div id="mn"><div id="hd" class="hd"></div><div id="pg"></div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),K='receipt-helper-v2';
const won=n=>Number(n||0).toLocaleString('ko-KR'),num=s=>parseInt(String(s==null?'':s).replace(/[^\d]/g,''),10)||0;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE'),ym=d=>d.slice(0,7),uid=()=>Date.now()+Math.random().toString(36).slice(2,6);
const addM=(m,k)=>{const d=new Date(m+'-01T00:00:00');d.setMonth(d.getMonth()+k);return d.toLocaleDateString('sv-SE').slice(0,7)};
const short=n=>n>=10000?(n/10000).toFixed(n%10000?1:0)+'만':won(n);
const DEF={'생활비':['식비','카페·간식','편의점','생필품','의류·잡화','미용·뷰티'],'교통·이동':['대중교통','택시','주유·충전','차량 유지비','주차·통행료'],'주거·공과금':['월세·관리비','전기·가스·수도','통신비','인터넷·구독료'],'업무·교육':['사무용품','업무 관련 지출','교육·강의','도서·문구','소프트웨어·IT'],'여가·문화':['영화·공연','여행·숙박','취미·운동','게임·콘텐츠'],'의료·건강':['병원·진료','약국','운동·헬스','건강관리'],'금융·기타':['보험료','금융 수수료','경조사','기타']};
const MAP={'교통':'대중교통','주유·차량':'주유·충전','생활·쇼핑':'생필품','사무·교육':'사무용품','의료·건강':'병원·진료','문화·여가':'영화·공연','통신·공과금':'통신비'};
const PAYS=['카드','현금','계좌이체','간편결제','기타'],MON=['supply','vat','total'],PAL=['#1e40af','#14b8a6','#38bdf8','#f59e0b','#a78bfa','#f472b6','#94a3b8'];
let S=null,st={page:'dash',month:''},dr,queue=[],sel=new Set(),dupArm=0,sample=null,DL=null,tt,busy='';
const ft={q:'',cat:'',tag:'',from:'',to:'',min:'',max:'',sort:'d-'};
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.recs)){S={recs:[],cats:DEF,budget:{total:0,by:{}}};
 try{const o=JSON.parse(localStorage.getItem('receipt-helper-v1'));if(Array.isArray(o))S.recs=o.map(r=>({id:r.id,date:r.date,time:r.time||'',merchant:r.merchant,cat:MAP[r.cat]||r.cat,supply:Math.max(0,(r.amount||0)-(r.vat||0)),vat:r.vat||0,total:r.amount||0,pay:'',memo:r.memo||'',tags:[],ai:!!r.ai}))}catch(e){}
 save()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('저장 공간 문제로 저장하지 못했어요')}}
S.rcr=S.rcr||[];S.budget=S.budget||{total:0,by:{}};S.budget.by=S.budget.by||{};S.budget.sub=S.budget.sub||{};
const nextD=(d,c)=>{const x=new Date(d+'T00:00:00');if(c==='weekly')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+(c==='yearly'?12:1));return x.toLocaleDateString('sv-SE')};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
const par=c=>Object.keys(S.cats).find(p=>S.cats[p].includes(c))||'금융·기타',allSubs=()=>Object.values(S.cats).flat();
const blank=()=>({date:today(),time:'',merchant:'',cat:allSubs()[0]||'기타',pay:'',supply:0,vat:0,total:0,memo:'',tags:''});
dr=blank();{const cm=ym(today());st.month=!S.recs.length||S.recs.some(r=>ym(r.date)===cm)?cm:S.recs.map(r=>ym(r.date)).sort().pop()}
const inM=m=>S.recs.filter(r=>ym(r.date)===m),sum=l=>l.reduce((s,r)=>s+r.total,0);
const grp=(l,f)=>{const o={};l.forEach(r=>{const k=f(r);o[k]=(o[k]||0)+r.total});return o},topN=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const arm=(b,t,fn)=>{if(b.dataset.arm){fn();return}b.dataset.arm=1;const o=b.textContent;b.textContent=t;setTimeout(()=>{if(b.isConnected){b.dataset.arm='';b.textContent=o}},3000)};
const empty=m=>`<div class="em">🗂️<div>${m||'이 기간에는 아직 지출 내역이 없어요.'}</div><button class="p" data-a="go" data-p="reg">영수증 등록하기</button></div>`;
const vbars=(it,sv)=>`<div class="vb">${it.map(([k,v,t])=>`<div class="c" title="${esc(t)}"><b>${sv&&v?short(v):''}</b><div class="bw"><i style="height:${v/Math.max(1,...it.map(x=>x[1]))*100}%"></i></div><small>${k}</small></div>`).join('')}</div>`;
const hb=it=>{const m=Math.max(1,...it.map(i=>i[1]));return it.map(([k,v])=>`<div class="br"><span title="${esc(k)}">${esc(k)}</span><div class="tr"><i style="width:${v/m*100}%"></i></div><b>${won(v)}원</b></div>`).join('')};
const donut=it=>{const T=it.reduce((s,i)=>s+i[1],0);let o=25;return `<div class="dn2"><svg viewBox="0 0 42 42" width="150" height="150">${it.map(([k,v],i)=>{const p=v/T*100,s=`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${PAL[i%7]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"><title>${esc(k)}: ${won(v)}원 (${p.toFixed(1)}%)</title></circle>`;o-=p;return s}).join('')}<text x="21" y="22" text-anchor="middle" font-size="3.6" fill="currentColor">${short(T)}</text></svg><div class="lg">${it.map(([k,v],i)=>`<div><i style="background:${PAL[i%7]}"></i>${esc(k)} <b>${won(v)}원</b> <span class="mu">${(v/T*100).toFixed(1)}%</span></div>`).join('')}</div></div>`};
const bar=(sp,b)=>{if(!b)return '<div class="mu s">예산 미설정</div>';const p=sp/b*100,c=p>=100?'r':p>=90?'o':p>=70?'y':'';return `<div class="tr"><i class="${c}" style="width:${Math.min(100,p)}%"></i></div><div class="s ${c}t">${p.toFixed(0)}% · ${won(sp)} / ${won(b)}원${p>=100?' · 예산 초과':p>=90?' · 90% 도달':p>=70?' · 70% 도달':''}</div>`};
const catSel=(f,v,x='')=>`<select id="f-${f}" data-f="${f}" class="${x}">${Object.keys(S.cats).map(p=>`<optgroup label="${esc(p)}">${S.cats[p].map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('')}</optgroup>`).join('')}</select>`;

const P={
dash(){const m=st.month,L=inM(m),pt=sum(inM(addM(m,-1))),t=sum(L),ch=pt?(t-pt)/pt*100:null,tc=topN(grp(L,r=>r.cat))[0];
 const cd=[['💳','총지출',won(t)+'원'],['📈','지난달 대비',ch==null?'비교할 데이터 없음':`<span class="${ch>0?'up':'dn'}">${ch>0?'▲':'▼'} ${Math.abs(ch).toFixed(1)}%</span>`],['🧾','영수증 등록',L.length+'건'],['⚖️','평균 지출',L.length?won(Math.round(t/L.length))+'원':'-'],['🏆','최다 지출 항목',tc?esc(tc[0]):'-']];
 const ms=[-5,-4,-3,-2,-1,0].map(k=>addM(m,k)),mv=ms.map(x=>[+x.slice(5)+'월',sum(inM(x)),`${x}: ${won(sum(inM(x)))}원`]),n=new Date(+m.slice(0,4),+m.slice(5),0).getDate(),o=grp(L,r=>+r.date.slice(8));
 return `<div class="g k">${cd.map(c=>`<div class="card sc"><div class="mu s">${c[0]} ${c[1]}</div><div class="v">${c[2]}</div></div>`).join('')}</div>
<div class="g"><div class="card"><h2>월별 지출 추이 (최근 6개월)</h2>${mv.some(x=>x[1])?vbars(mv,1):empty()}</div><div class="card"><h2>상위 카테고리별 비율</h2>${L.length?donut(topN(grp(L,r=>par(r.cat)))):empty()}</div></div>
<div class="card"><h2>일별 지출 추이</h2>${L.length?vbars(Array.from({length:n},(_,i)=>[(i+1)%5==0||!i?i+1:'',o[i+1]||0,`${m}-${String(i+1).padStart(2,'0')}: ${won(o[i+1]||0)}원`])):empty()}</div>`},
reg(){const d=dr,bd=f=>d.bad&&d.bad.includes(f)?'bad':'';
 const fl=(l,f,v,x='')=>`<div><label>${l}</label><input id="f-${f}" data-f="${f}" class="${bd(f)}" value="${esc(v)}" ${x}></div>`,mf=(l,f)=>fl(l,f,d[f]?won(d[f]):'','inputmode="numeric"');
 return `<div class="card"><h2>영수증 사진으로 등록</h2><button class="p" data-a="pick" ${sample?'':'disabled'}>📷 사진 선택</button> <span class="mu s" id="bz">${busy}</span><p class="mu s">${sample?'AI가 읽은 내용은 바로 저장하지 않고 아래 검수 화면에 보여 드려요. 확실하지 않거나 빠진 항목은 빨갛게 표시돼요.':'AI 사진 읽기는 claude.ai에서 열었을 때만 쓸 수 있어요. 아래에서 직접 입력해 주세요.'}</p><input type="file" id="fi" accept="image/*" multiple hidden data-c="up"></div>
<div class="card"><h2>${d.id?'내역 수정':d.ai?'AI 검수':'직접 입력'}${queue.length?` · 검수 대기 ${queue.length}건`:''}</h2><div class="row">${fl('거래 날짜','date',d.date,'type="date"')}${fl('시간(선택)','time',d.time,'type="time"')}${fl('가맹점명','merchant',d.merchant)}<div><label>지출 카테고리</label>${catSel('cat',d.cat)}</div><div><label>결제 수단</label><select id="f-pay" data-f="pay"><option value="">미선택</option>${PAYS.map(p=>`<option ${p===d.pay?'selected':''}>${p}</option>`).join('')}</select></div>${mf('공급가액(원)','supply')}${mf('부가세(원)','vat')}${mf('총 결제 금액(원)','total')}${fl('태그(쉼표로 구분)','tags',d.tags,'placeholder="업무용, 출장"')}<div style="grid-column:1/-1">${fl('메모','memo',d.memo)}</div></div>
<div class="bar"><button class="p" data-a="save">${d.id?'수정 저장':'확정 저장'}</button><button data-a="cancel">${d.id?'수정 취소':d.ai?'건너뛰기':'초기화'}</button></div></div>`},
list(){const o=Object.keys(S.cats).map(p=>`<optgroup label="${esc(p)}"><option value="p:${esc(p)}">${esc(p)} 전체</option>${S.cats[p].map(c=>`<option value="s:${esc(c)}">${esc(c)}</option>`).join('')}</optgroup>`).join('');
 const tg=[...new Set(S.recs.flatMap(r=>r.tags||[]))];
 return `<div class='card'>${tg.length?`<div class='bar' style='margin:0 0 10px'>${tg.map(t=>`<button class='${ft.tag===t?'p':''}' data-a='tag' data-v='${esc(t)}'>#${esc(t)}</button>`).join('')}</div>`:''}<div class="fl"><input data-g="q" placeholder="가맹점·메모·태그 검색" value="${esc(ft.q)}"><select data-g="cat"><option value="">전체 카테고리</option>${o}</select><input type="date" data-g="from" title="시작일" value="${ft.from}"><input type="date" data-g="to" title="종료일" value="${ft.to}"><input data-g="min" inputmode="numeric" placeholder="최소 금액" value="${esc(ft.min)}"><input data-g="max" inputmode="numeric" placeholder="최대 금액" value="${esc(ft.max)}"><select data-g="sort">${[['d-','날짜 최신순'],['d+','날짜 오래된순'],['a-','금액 높은순'],['a+','금액 낮은순']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div></div><div class="card" id="lst">${lh()}</div>`},
ana(){const m=st.month,L=inM(m),Pv=inM(addM(m,-1)),t=sum(L);if(!L.length)return `<div class="card">${empty()}</div>`;
 const cs=topN(grp(L,r=>r.cat)),ps=topN(grp(L,r=>par(r.cat))),dy=topN(grp(L,r=>r.date))[0],dn=m===ym(today())?+today().slice(8):new Date(+m.slice(0,4),+m.slice(5),0).getDate();
 const pg=grp(Pv,r=>par(r.cat)),cg=grp(L,r=>par(r.cat)),ks=[...new Set([...Object.keys(pg),...Object.keys(cg)])],df=topN(Object.fromEntries(ks.map(k=>[k,(cg[k]||0)-(pg[k]||0)]))).filter(x=>x[1]>0).slice(0,3);
 const ins=[`가장 많이 쓴 항목은 ${cs[0][0]}(${won(cs[0][1])}원)이에요.`,`${ps[0][0]} 분류가 전체의 ${(ps[0][1]/t*100).toFixed(1)}%를 차지해요.`,`지출이 가장 많았던 날은 ${dy[0]}(${won(dy[1])}원)이에요.`,`일평균 지출은 ${won(Math.round(t/dn))}원이에요.`,Pv.length?(df.length?`지난달보다 늘어난 분류: ${df.map(([k,v])=>`${k} +${won(v)}원`).join(', ')}`:'지난달보다 늘어난 분류가 없어요.'):'지난달 내역이 없어 증감은 분석하지 않았어요.'];
 return `<div class="card"><h2>지출 인사이트 <span class="mu s">저장된 ${L.length}건 기준</span></h2><ul>${ins.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>

const FL=['merchant','date','time','supply','vat','total','pay'],DRE=/^\d{4}-\d{2}-\d{2}$/;
function mk(d){const x=blank();x.ai=true;x.merchant=String(d.merchant||'').trim();x.date=DRE.test(d.date)?d.date:today();x.time=/^\d{2}:\d{2}$/.test(d.time)?d.time:'';x.supply=num(d.supply);x.vat=num(d.vat);x.total=num(d.total)||x.supply+x.vat;x.pay=PAYS.includes(d.pay)?d.pay:'';x.cat=allSubs().includes(d.category)?d.category:'기타';
 x.bad=(Array.isArray(d.uncertain)?d.uncertain:[]).filter(f=>FL.includes(f));if(!x.merchant)x.bad.push('merchant');if(!x.total)x.bad.push('total');if(!DRE.test(d.date))x.bad.push('date');
 if(!x.supply&&x.total)x.supply=Math.max(0,x.total-x.vat);return x}
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function shrink(f){const img=await new Promise(async(ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=await readURL(f)});
 const s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}

async function ex(scope,fmt){if(!DL){toast('이 화면에서는 파일 저장을 쓸 수 없어요');return}
 let l=scope==='month'?inM(st.month):scope==='list'?filt():S.recs;if(!l.length&&fmt!=='json'){toast('내보낼 내역이 없어요');return}
 l=[...l].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const nm='영수증_지출내역_'+(scope==='month'?st.month:today());
 try{if(fmt==='json'){await DL.save({filename:'영수증_백업_'+today()+'.json',data:JSON.stringify(S,null,1)});return}
  const aoa=[['날짜','가맹점','상위 카테고리','하위 카테고리','공급가액','부가세','총액','결제 수단','메모','태그'],...l.map(r=>[r.date+(r.time?' '+r.time:''),r.merchant,par(r.cat),r.cat,r.supply,r.vat,r.total,r.pay||'',r.memo||'',(r.tags||[]).join(', ')])];
  if(fmt==='xlsx'&&window.XLSX){const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:16},{wch:20},{wch:12},{wch:14},{wch:12},{wch:10},{wch:12},{wch:10},{wch:24},{wch:14}];
   for(let i=2;i<=aoa.length;i++)['E','F','G'].forEach(c=>{if(ws[c+i])ws[c+i].z='#,##0'});
   const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'지출내역');await DL.save({filename:nm+'.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})})}
  else await DL.save({filename:nm+'.csv',data:'\ufeff'+aoa.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')})
 }catch(e){if(!e||e.code!=='declined')toast('파일을 저장하지 못했어요')}}
