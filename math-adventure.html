<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수학 대모험</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--b1:#e6d9ff;--b2:#c9f7e6;--b3:#ffd9ea;--b4:#d3e8ff;--gl:rgba(255,255,255,.5);--gb:rgba(255,255,255,.8);--tx:#3b2f63;--mu:#7a6fa3;--ac:#8b6cf6;--mt:#2ec4a0;--ok:#22c55e;--bad:#ef4444;--sh:rgba(110,80,200,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1f55;--b2:#123f3a;--b3:#4a2342;--b4:#1c2e57;--gl:rgba(30,26,62,.55);--gb:rgba(255,255,255,.16);--tx:#f1ecff;--mu:#b9afe0;--sh:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--b1:#2a1f55;--b2:#123f3a;--b3:#4a2342;--b4:#1c2e57;--gl:rgba(30,26,62,.55);--gb:rgba(255,255,255,.16);--tx:#f1ecff;--mu:#b9afe0;--sh:rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;min-height:100%;font-family:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400;color:var(--tx);background:linear-gradient(-45deg,var(--b1),var(--b2),var(--b3),var(--b4));background-size:400% 400%;background-attachment:fixed;animation:bg 18s ease infinite;user-select:none;-webkit-user-select:none}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
button{font-family:inherit;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 28px}
.card{background:var(--gl);border:1.5px solid var(--gb);border-radius:24px;padding:16px;margin-bottom:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 28px var(--sh)}
h1{font-size:28px;margin:0;font-weight:400}
h2{font-size:18px;margin:0 0 10px;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--gl);border:1.5px solid var(--gb);border-radius:99px;padding:6px 12px;font-size:15px;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
.bar{height:12px;border-radius:99px;background:rgba(130,110,210,.2);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--mt));transition:width .3s}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.opt{flex:1 1 auto;border:2px solid var(--gb);background:transparent;color:var(--tx);border-radius:16px;padding:10px 12px;font-size:16px;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.7,.5,1),background .2s}
.opt:active{transform:scale(.93)}
.opt.on{background:linear-gradient(135deg,var(--ac),#b79cff);color:#fff;border-color:transparent}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.mc{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:22px;border:1.5px solid var(--gb);background:var(--gl);color:var(--tx);font-size:18px;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 24px var(--sh);transition:transform .15s cubic-bezier(.3,1.7,.5,1)}
.mc:hover{transform:translateY(-3px)}.mc:active{transform:scale(.94)}
.ei{font-size:34px}.mc small{font-size:13px;color:var(--mu)}
.btn{border:0;border-radius:18px;padding:12px 18px;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--ac),#b79cff);box-shadow:0 5px 0 rgba(90,60,190,.35);cursor:pointer;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.btn:active{transform:scale(.94) translateY(3px)}
.btn.alt{background:linear-gradient(135deg,#34d3a5,#7ee8c9);box-shadow:0 5px 0 rgba(20,140,110,.35)}
.btn.ghost{background:var(--gl);color:var(--tx);box-shadow:none;border:1.5px solid var(--gb);width:100%}
.hud{display:flex;gap:8px}.hud .chip{flex:1;text-align:center;padding:8px 6px;font-size:14px}
.qc{text-align:center}
#q{font-size:clamp(34px,10vw,54px);margin:6px 0}
#ans{height:68px;display:flex;align-items:center;justify-content:center;font-size:38px;border-radius:20px;background:var(--gl);border:3px solid var(--gb);margin-bottom:6px;transition:box-shadow .2s,border-color .2s}
#ans.good{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.35),0 0 36px 8px rgba(34,197,94,.6)}
#ans.bad{border-color:var(--bad);color:var(--bad);box-shadow:0 0 26px rgba(239,68,68,.55);animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#fb{min-height:28px;text-align:center;font-size:17px;margin-bottom:8px;color:var(--mu)}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.k{height:clamp(58px,10vh,76px);border:0;border-radius:26px;font-size:30px;color:#3b2f63;background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(210,195,255,.75));box-shadow:0 6px 0 rgba(130,100,220,.35),0 10px 18px var(--sh);transition:transform .14s cubic-bezier(.3,1.8,.5,1),box-shadow .14s;touch-action:manipulation;cursor:pointer}
.k:active{transform:scale(.9) translateY(4px);box-shadow:0 2px 0 rgba(130,100,220,.35)}
.k.go{background:linear-gradient(160deg,#6ee7b7,#2ec4a0);color:#fff;font-size:24px}
.k.del{background:linear-gradient(160deg,#ffd9e8,#ff9fc2)}
.rw{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--gb);font-size:17px}
.sm{background:var(--gl);border:1.5px solid var(--gb);border-radius:16px;padding:10px;text-align:center;font-size:13px;color:var(--mu)}
.sm b{display:block;font-size:20px;color:var(--tx);font-weight:400;margin-top:2px}
.cw{position:relative;height:min(80vw,320px)}
#an{margin-top:10px;font-size:15px;line-height:1.6}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.bd{text-align:center;padding:10px 6px;border-radius:18px;background:var(--gl);border:1.5px solid var(--gb);filter:grayscale(1);opacity:.5}
.bd.on{filter:none;opacity:1;box-shadow:0 0 0 2px var(--ac)}
.bd b{display:block;font-size:30px;font-weight:400}.bd span{font-size:14px}.bd small{display:block;font-size:11px;color:var(--mu)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:60;pointer-events:none}
.ts{background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;margin-bottom:8px;font-size:16px;animation:tin .3s;box-shadow:0 6px 18px var(--sh)}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<canvas id="cf"></canvas><div id="toasts"></div>
<div class="wrap">
  <div class="card">
    <div class="top"><h1>🧮 수학 대모험</h1><span class="chip" id="sd"></span></div>
    <div class="top" style="margin-top:12px"><b id="tt" style="font-weight:400;font-size:18px"></b><span class="mu" id="xp"></span></div>
    <div class="bar" style="margin-bottom:0"><i id="xb"></i></div>
  </div>
  <div class="tabs" id="nav"><button class="opt on" data-s="home">🎮 게임</button><button class="opt" data-s="stats">📊 통계·업적</button></div>

  <section id="home">
    <div class="card">
      <h2>연산 선택 (여러 개 가능)</h2><div class="row" id="ops"></div>
      <h2 style="margin-top:14px">난이도</h2><div class="row" id="lvs"></div>
      <p class="mu" style="margin:10px 0 0">곱셈·나눗셈은 인수 범위를 줄여 출제돼요. 마스터전은 혼합 연산으로 고정!</p>
    </div>
    <div class="grid2" id="modes"></div>
  </section>

  <section id="game" hidden>
    <div class="hud"><div class="chip">⭐ <span id="hs">0</span></div><div class="chip" id="hc"></div><div class="chip" id="hv"></div></div>
    <div class="bar"><i id="pb"></i></div>
    <div class="card qc"><div class="mu" id="gm"></div><div id="q"></div></div>
    <div id="ans">?</div><div id="fb"></div>
    <div id="pad"></div>
    <button class="btn ghost" id="quit">그만하기</button>
  </section>

  <section id="result" hidden>
    <div class="card"><h2 id="rt" style="font-size:24px"></h2><div id="rb"></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="again">다시 도전</button><button class="btn alt" id="home2">홈으로</button></div>
    </div>
  </section>

  <section id="stats" hidden>
    <div class="card"><h2>📈 나의 기록</h2><div class="grid2" id="sum" style="margin:0"></div></div>
    <div class="card"><h2>🕸️ 영역별 정답률</h2><div class="cw"><canvas id="rc"></canvas></div><div id="an"></div></div>
    <div class="card"><h2>🏅 업적 뱃지 <span class="mu" id="bc"></span></h2><div class="bg" id="bgs"></div></div>
    <button class="btn ghost" id="rst">기록 초기화</button>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const KEY='mathAdventure_v1',OPS=['+','−','×','÷'],NM=['덧셈','뺄셈','곱셈','나눗셈'];
const def=()=>({xp:0,total:0,solved:0,miss:0,maxCombo:0,days:0,last:'',tc:0,best:{time:0,inf:0,chal:0,master:0},bestMT:0,clv:1,clears:{chal:0,master:0},st:{'+':[0,0],'−':[0,0],'×':[0,0],'÷':[0,0]},bd:[]});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.st)return Object.assign(def(),r)}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
let D=load(),S={ops:['+','−'],lv:1,mode:'time'},G=null,cur=null,buf='',tm=0;
const T=[[0,'🌱','수학 새싹'],[150,'🐣','계산 병아리'],[400,'🐰','숫자 토끼'],[800,'🦊','암산 여우'],[1500,'🦁','연산 사자'],[3000,'🐉','수학 용사'],[6000,'🧙','수학 마법사'],[12000,'👑','수학 대왕']];
const tIdx=x=>{let i=0;T.forEach((t,j)=>{if(x>=t[0])i=j});return i};
const B=[
['first','👣','첫걸음','첫 정답 맞히기',d=>d.solved>=1],
['s50','🥉','정답 50','정답 50개',d=>d.solved>=50],
['s200','🥈','정답 200','정답 200개',d=>d.solved>=200],
['s1000','🥇','정답 1000','정답 1000개',d=>d.solved>=1000],
['c5','🔥','5콤보','5연속 정답',d=>d.maxCombo>=5],
['c10','⚡','10콤보','10연속 정답',d=>d.maxCombo>=10],
['c20','🌈','20콤보','20연속 정답',d=>d.maxCombo>=20],
['t15','⏱️','번개 손','타임어택 15문제',d=>d.tc>=15],
['t30','🚀','초고속','타임어택 30문제',d=>d.tc>=30],
['ch','🏆','챌린저','챌린지 클리어',d=>d.clears.chal>=1],
['ms','👑','마스터','마스터전 클리어',d=>d.clears.master>=1],
['d3','📅','3일 연속','3일 연속 학습',d=>d.days>=3],
['d7','🗓️','7일 연속','7일 연속 학습',d=>d.days>=7],
['all','🌟','올라운더','모든 연산 정답 20개',d=>OPS.every(o=>d.st[o][0]>=20)],
['xp','🎖️','사자의 길','연산 사자 등급 달성',d=>tIdx(d.xp)>=4]];
const R=n=>Math.floor(Math.random()*n),ri=(a,b)=>a+R(b-a+1);
const LV={1:10,2:50,3:100},FM={1:9,2:12,3:20};
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(),yk=()=>dk(new Date(Date.now()-864e5));
const alive=()=>D.last===dk(new Date())||D.last===yk()?D.days:0;
function today(){const k=dk(new Date());if(D.last===k)return;D.days=D.last===yk()?D.days+1:1;D.last=k;save()}
function toast(t){const d=document.createElement('div');d.className='ts';d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2400)}
function chk(){B.forEach(b=>{if(!D.bd.includes(b[0])&&b[4](D)){D.bd.push(b[0]);toast('🏅 업적 달성! '+b[1]+' '+b[2]);burst(innerWidth/2,innerHeight/4,50)}})}
function hdr(){const i=tIdx(D.xp),n=T[i+1];$('#tt').textContent=T[i][1]+' '+T[i][2];$('#xp').textContent=D.xp+(n?' / '+n[0]:'')+' XP';$('#xb').style.width=(n?(D.xp-T[i][0])/(n[0]-T[i][0])*100:100)+'%';$('#sd').textContent='🔥 '+alive()+'일 연속'}
const anim=(e,c)=>{e.classList.remove(c);void e.offsetWidth;e.classList.add(c)};
let AC;function beep(f,d=.12,t='sine'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* 컨페티 */
const cv=$('#cf'),cx=cv.getContext('2d');let P=[],raf=0;
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
function burst(x,y,n=40){const C=['#22c55e','#86efac','#fde047','#a78bfa','#f9a8d4','#5eead4'];for(let i=0;i<n;i++){const a=Math.random()*6.28,s=4+Math.random()*8;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:4+Math.random()*5,c:C[R(C.length)],l:60+R(40),t:Math.random()*6,v:(Math.random()-.5)*.4})}if(!raf)raf=requestAnimationFrame(loop)}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.98;p.t+=p.v;cx.save();cx.translate(p.x,p.y);cx.rotate(p.t);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/25);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});raf=P.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}

/* 문제 생성 */
function gen(){
  if(S.mode==='master')return genM();
  const o=S.ops[R(S.ops.length)],m=Math.round(LV[S.lv]*(S.mode==='chal'?1+(D.clv-1)*.15:1)),f=FM[S.lv];let a,b,q;
  if(o==='+'){a=ri(1,m);b=ri(1,m);q=a+b}
  else if(o==='−'){a=ri(2,m);b=ri(1,a);q=a-b}
  else if(o==='×'){a=ri(2,f);b=ri(2,f);q=a*b}
  else{b=ri(2,f);q=ri(1,f);a=b*q}
  return{t:a+' '+o+' '+b,a:q,o:[o]}
}
function genM(){
  const k=[5,9,12][S.lv-1],w=[10,30,60][S.lv-1],x=ri(2,k),y=ri(2,k),t=R(4);let z,s,a,o;
  if(t===0){z=ri(1,w);s=z+' + '+x+' × '+y;a=z+x*y;o=['+','×']}
  else if(t===1){z=ri(1,w);s='('+z+' + '+x+') × '+y;a=(z+x)*y;o=['+','×']}
  else if(t===2){z=ri(1,Math.min(w,x*y));s=x+' × '+y+' − '+z;a=x*y-z;o=['×','−']}
  else{z=ri(1,w);s=(x*y)+' ÷ '+x+' + '+z;a=y+z;o=['÷','+']}
  return{t:s,a,o}
}

/* 게임 흐름 */
const bar=p=>$('#pb').style.width=p+'%';
function hud(){
  const m=G.m;$('#hs').textContent=G.sc;$('#hc').textContent='🔥 '+G.cb+' · ×'+Math.min(5,1+Math.floor(G.cb/5));
  if(m==='inf'){$('#hv').textContent='정답 '+G.ok;bar(0)}
  if(m==='chal'){$('#hv').textContent='LV'+D.clv+' · '+G.cb+'/10';bar(G.cb*10)}
  if(m==='master'){$('#hv').textContent='⏱ '+Math.floor((Date.now()-G.t0)/1000)+'초 · '+G.ok+'/5';bar(G.ok*20)}
}
function tick(){
  if(!G||G.done)return;
  if(G.m==='time'){G.left=Math.max(0,60-(Date.now()-G.t0)/1000);$('#hv').textContent='⏱ '+Math.ceil(G.left)+'초';bar(G.left/.6);if(G.left<=0)end(false)}
  else hud();
}
function start(m){
  if(m!=='master'&&!S.ops.length)return toast('연산을 하나 이상 선택해 주세요');
  S.mode=m;today();clearInterval(tm);
  G={m,sc:0,xp:0,ok:0,no:0,cb:0,mx:0,t0:Date.now(),left:60,tier:tIdx(D.xp),done:false,lock:false};
  const n={time:'⏱️ 타임어택',inf:'♾️ 무한모드',chal:'🏆 챌린지 모드',master:'👑 마스터전'};
  $('#gm').textContent=n[m]+' · '+['초급','중급','고급'][S.lv-1];
  show('game');next();tick();tm=setInterval(tick,250);
}
function next(){
  G.lock=false;cur=gen();buf='';
  $('#q').textContent=cur.t+' = ?';anim($('#q'),'pop');
  $('#ans').textContent='?';$('#ans').className='';$('#fb').textContent='';hud();
}
const showAns=()=>$('#ans').textContent=buf===''?'?':buf;
function key(k){
  if(!G||G.done||G.lock)return;
  if(k==='확인')return submit();
  if(k==='⌫')buf=buf.slice(0,-1);
  else if(buf.length<5)buf=buf==='0'?String(k):buf+k;
  showAns();
}
function after(ms,retry){
  const g=G;
  setTimeout(()=>{
    if(G!==g||g.done)return;
    if(retry){g.lock=false;buf='';showAns();$('#fb').textContent='';$('#ans').className=''}else next();
  },ms);
}
function submit(){
  if(G.lock||buf==='')return;
  G.lock=true;
  const ok=+buf===cur.a,m=G.m,L=S.lv*(m==='master'?2:1),a=$('#ans');
  cur.o.forEach(o=>D.st[o][ok?0:1]++);
  if(ok){
    const mu=Math.min(5,1+Math.floor(G.cb/5));G.cb++;G.ok++;G.mx=Math.max(G.mx,G.cb);
    let p=10*L*mu,x=5*L*mu;
    if(G.cb%5===0){const b=G.cb*10;p+=b;x+=20;toast('🔥 '+G.cb+'연속 보너스 +'+b+'점!')}
    G.sc+=p;G.xp+=x;D.total+=p;D.xp+=x;D.solved++;D.maxCombo=Math.max(D.maxCombo,G.cb);
    anim(a,'good');const r=a.getBoundingClientRect();burst(r.left+r.width/2,r.top,30+G.cb*2);
    beep(660,.1);setTimeout(()=>beep(990,.15),90);
    $('#fb').textContent='+'+p+'점'+(mu>1?' (콤보 ×'+mu+')':'');
  }else{
    G.cb=0;G.no++;D.miss++;anim(a,'bad');beep(160,.3,'sawtooth');
    $('#fb').textContent=m==='master'?'다시 도전해 봐요! 💪':'정답은 '+cur.a+' 이에요';
  }
  const ti=tIdx(D.xp);
  if(ti>G.tier){G.tier=ti;toast('🎖️ 등급 상승! '+T[ti][1]+' '+T[ti][2]);burst(innerWidth/2,innerHeight/3,120)}
  chk();save();hud();hdr();
  if(ok&&((m==='chal'&&G.cb>=10)||(m==='master'&&G.ok>=5))){const g=G;return setTimeout(()=>end(true,g),600)}
  after(ok?700:1100,!ok&&m==='master');
}
function end(win,g){
  g=g||G;if(!g||g.done||g!==G)return;
  clearInterval(tm);g.done=true;
  const m=g.m,el=Math.round((Date.now()-g.t0)/1000),rec=g.sc>D.best[m];
  let t='👏 수고했어요!';
  if(rec)D.best[m]=g.sc;
  if(m==='time'){D.tc=Math.max(D.tc,g.ok);t='⏰ 타임 업!'}
  if(m==='chal'&&win){D.clears.chal++;D.clv++;t='🎉 레벨업! 챌린지 LV '+D.clv}
  if(m==='master'&&win){D.clears.master++;if(!D.bestMT||el<D.bestMT)D.bestMT=el;t='👑 마스터전 클리어!'}
  if(win)for(let i=0;i<4;i++)setTimeout(()=>burst(innerWidth*(.2+.2*i),innerHeight*.4,70),i*220);
  chk();save();
  $('#rt').textContent=t;
  $('#rb').innerHTML=[['점수',g.sc+(rec?' 🏆 신기록!':'')],['정답 / 오답',g.ok+' / '+g.no],['최고 콤보',g.mx],['획득 XP','+'+g.xp],['걸린 시간',el+'초']].map(r=>'<div class="rw"><span>'+r[0]+'</span><b style="font-weight:400">'+r[1]+'</b></div>').join('');
  show('result');
}

/* 통계 */
let CH;
function stats(){
  const acc=OPS.map(o=>{const c=D.st[o][0],w=D.st[o][1];return c+w?Math.round(c/(c+w)*100):0});
  const tx=getComputedStyle(document.documentElement).getPropertyValue('--tx').trim()||'#3b2f63';
  if(CH){CH.destroy();CH=null}
  if(typeof Chart!=='undefined'){
    Chart.defaults.font.family="'Jua','Noto Sans KR',sans-serif";
    CH=new Chart($('#rc'),{type:'radar',data:{labels:['덧셈 ➕','뺄셈 ➖','곱셈 ✖️','나눗셈 ➗'],datasets:[{label:'정답률(%)',data:acc,backgroundColor:'rgba(139,108,246,.3)',borderColor:'#8b6cf6',pointBackgroundColor:'#2ec4a0',pointRadius:5,borderWidth:3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{stepSize:25,backdropColor:'transparent',color:tx},pointLabels:{color:tx,font:{size:15}},grid:{color:'rgba(140,120,200,.35)'},angleLines:{color:'rgba(140,120,200,.35)'}}}}});
  }
  const tip={'+':'받아올림을 천천히 확인하며 일의 자리부터 더해 보세요.','−':'받아내림에 주의하고, 답에 뺀 수를 더해 검산해 보세요.','×':'구구단을 소리 내어 외우며 작은 수부터 반복해 보세요.','÷':'나눗셈은 곱셈의 거꾸로예요. 곱셈 구구를 먼저 탄탄히 다져요!'};
  const at=OPS.map((o,i)=>[i,D.st[o][0]+D.st[o][1]]).filter(x=>x[1]>=3);
  let h;
  if(!at.length)h='아직 데이터가 부족해요. 각 연산을 3문제 이상 풀면 분석해 드려요! 🧐';
  else{const i=at.reduce((a,b)=>acc[b[0]]<acc[a[0]]?b:a)[0];
    h=acc[i]>=90?'🎉 모든 영역이 훌륭해요! 가장 낮은 '+NM[i]+'도 '+acc[i]+'%예요. 난이도를 올려 볼까요?':'⚠️ 가장 취약한 연산은 <b style="font-weight:400;color:var(--bad)">'+NM[i]+'</b> ('+acc[i]+'%)예요.<br>💡 '+tip[OPS[i]]}
  h+='<div class="mu" style="margin-top:8px">'+NM.map((n,i)=>n+' '+D.st[OPS[i]][0]+'정답·'+D.st[OPS[i]][1]+'오답 ('+acc[i]+'%)').join('<br>')+'</div>';
  $('#an').innerHTML=h;
  const sm=[['⭐ 누적 점수',D.total],['🎖️ 누적 XP',D.xp],['✅ 정답',D.solved],['❌ 오답',D.miss],['🔥 최고 콤보',D.maxCombo],['📅 연속 학습',alive()+'일'],['⏱️ 타임어택 최고',D.best.time],['♾️ 무한모드 최고',D.best.inf],['🏆 챌린지 최고',D.best.chal+' (LV'+D.clv+')'],['👑 마스터전 최고',D.best.master+(D.bestMT?' · '+D.bestMT+'초':'')]];
  $('#sum').innerHTML=sm.map(s=>'<div class="sm">'+s[0]+'<b>'+s[1]+'</b></div>').join('');
  $('#bc').textContent=D.bd.length+' / '+B.length;
  $('#bgs').innerHTML=B.map(b=>'<div class="bd'+(D.bd.includes(b[0])?' on':'')+'"><b>'+b[1]+'</b><span>'+b[2]+'</span><small>'+b[3]+'</small></div>').join('');
}

/* 화면 전환 */
function show(id){
  ['home','game','result','stats'].forEach(s=>$('#'+s).hidden=s!==id);
  $('#nav').hidden=id==='game'||id==='result';
  [...$('#nav').children].forEach(b=>b.classList.toggle('on',b.dataset.s===(id==='stats'?'stats':'home')));
  hdr();if(id==='stats')stats();scrollTo(0,0);
}

/* 초기화 & 이벤트 */
$('#ops').innerHTML=['➕ 덧셈','➖ 뺄셈','✖️ 곱셈','➗ 나눗셈'].map((n,i)=>'<button class="opt'+(S.ops.includes(OPS[i])?' on':'')+'" data-o="'+OPS[i]+'">'+n+'</button>').join('');
$('#ops').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const o=b.dataset.o,i=S.ops.indexOf(o);i<0?S.ops.push(o):S.ops.splice(i,1);b.classList.toggle('on',i<0)};
$('#lvs').innerHTML=['🌱 초급 1~10','🌿 중급 1~50','🌳 고급 1~100'].map((n,i)=>'<button class="opt'+(i===0?' on':'')+'" data-l="'+(i+1)+'">'+n+'</button>').join('');
$('#lvs').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.lv=+b.dataset.l;[...$('#lvs').children].forEach(x=>x.classList.toggle('on',x===b))};
$('#modes').innerHTML=[['time','⏱️','타임어택','60초 안에 최대한 많이!'],['inf','♾️','무한모드','시간 제한 없이 연습'],['chal','🏆','챌린지','10문제 연속 정답 시 레벨업'],['master','👑','마스터전','혼합 연산 5문제 클리어']].map(m=>'<button class="mc" data-m="'+m[0]+'"><span class="ei">'+m[1]+'</span><b style="font-weight:400">'+m[2]+'</b><small>'+m[3]+'</small></button>').join('');
$('#modes').onclick=e=>{const b=e.target.closest('.mc');if(b)start(b.dataset.m)};
$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'확인'].map(k=>'<button class="k'+(k==='확인'?' go':k==='⌫'?' del':'')+'" data-k="'+k+'">'+k+'</button>').join('');
$('#pad').onclick=e=>{const b=e.target.closest('.k');if(b)key(b.dataset.k)};
addEventListener('keydown',e=>{
  if(!G||$('#game').hidden)return;
  if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('확인');
});
$('#quit').onclick=()=>end(false);
$('#again').onclick=()=>start(G.m);
$('#home2').onclick=()=>show('home');
$('#nav').onclick=e=>{const s=e.target.dataset.s;if(s)show(s)};
let rc=0;
$('#rst').onclick=function(){
  if(!rc){rc=1;this.textContent='정말 삭제할까요? 한 번 더 누르세요';setTimeout(()=>{rc=0;this.textContent='기록 초기화'},3000)}
  else{D=def();save();rc=0;this.textContent='기록 초기화';show('stats')}
};
show('home');
</script>
</body>
</html>
