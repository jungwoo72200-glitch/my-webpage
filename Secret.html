<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀 우체통 - 비대면 소통 창구</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen py-10 px-4">
  <div class="max-w-xl mx-auto space-y-6">
    
    <!-- 상단 헤더 우체통 디자인 -->
    <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-xl border border-white/50 p-8 text-center relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-200/50 rounded-full blur-2xl pointer-events-none"></div>
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl text-3xl mb-4 shadow-inner">
        📮
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">선생님과의 비밀 우체통</h1>
      <p class="text-sm text-slate-500 mt-2 max-w-md mx-auto">
        하고 싶은 이야기나 고민이 있나요? 편하게 적어 남겨주시면 선생님의 이메일로 안전하게 전달되어 정성껏 읽어드립니다.
      </p>
    </div>

    <!-- 고민 작성 카드 폼 -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
      <form id="secretForm" onsubmit="handleSubmit(event)" class="space-y-5">
        
        <!-- 카테고리 선택 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">고민 카테고리</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="category" value="고민/상담" checked class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition shadow-sm">
                고민·상담
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="진로/학업" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition shadow-sm">
                진로·학업
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="category" value="칭찬/건의" class="peer sr-only">
              <div class="text-center py-2.5 px-3 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 transition shadow-sm">
                칭찬·건의
              </div>
            </label>
          </div>
        </div>

        <!-- 작성자 (익명 가능) -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">이름 또는 학번 (선택사항)</label>
          <input type="text" id="authorInput" placeholder="적지 않으면 자동으로 '익명'으로 접수됩니다"
            class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
        </div>

        <!-- 고민 내용 -->
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">고민 내용 *</label>
          <textarea id="contentInput" required rows="5" placeholder="선생님께 하고 싶은 이야기를 편하게 적어주세요. (비밀이 철저히 보장됩니다)"
            class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50 resize-none"></textarea>
        </div>

        <!-- 제출 버튼 -->
        <button type="submit" id="submitBtn"
          class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition transform active:scale-[0.99]">
          💌 비밀 편지 우체통에 넣기
        </button>
      </form>

      <!-- 알림 메시지 영역 -->
      <div id="statusAlert" class="hidden mt-4 p-4 rounded-xl text-sm font-medium text-center"></div>
    </div>

    <!-- 검토질문 ① & 하단 안내: 교사용 QR 코드 생성 도구 -->
    <div class="bg-white/60 backdrop-blur-sm rounded-2xl p-6 border border-slate-200/80 text-center space-y-3">
      <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">교사용 도구 및 QR 안내</h3>
      <p class="text-xs text-slate-500">학생들이 스마트폰으로 스캔해 바로 접속할 수 있는 QR코드를 생성합니다.</p>
      <button onclick="loadQrCode()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold rounded-lg transition shadow-sm">
        📱 학생용 접속 QR 코드 보기
      </button>
      <div id="qrContainer" class="hidden mt-4 p-4 bg-white rounded-xl border border-slate-200 inline-block">
        <img id="qrImage" src="" alt="접속 QR 코드" class="w-36 h-36 mx-auto mb-2 rounded-lg">
        <p id="qrUrlText" class="text-[11px] text-slate-400 break-all max-w-xs mx-auto"></p>
      </div>
    </div>

  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const category = document.querySelector('input[name="category"]:checked').value;
      const author = document.getElementById('authorInput').value;
      const content = document.getElementById('contentInput').value;

      submitBtn.disabled = true;
      submitBtn.textContent = '우체통에 넣는 중... 🕊️';

      google.script.run
        .withSuccessHandler(function(response) {
          submitBtn.disabled = false;
          submitBtn.textContent = '💌 비밀 편지 우체통에 넣기';

          if (response.success) {
            showAlert(response.message, true);
            document.getElementById('secretForm').reset();
          } else {
            showAlert(response.message, false);
          }
        })
        .withFailureHandler(function(err) {
          submitBtn.disabled = false;
          submitBtn.textContent = '💌 비밀 편지 우체통에 넣기';
          showAlert('전송 중 오류가 발생했습니다: ' + err.message, false);
        })
        .submitSecret({ category, author, content });
    }

    function loadQrCode() {
      const container = document.getElementById('qrContainer');
      container.classList.remove('hidden');
      document.getElementById('qrUrlText').textContent = 'QR 코드 생성 중...';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            document.getElementById('qrImage').src = res.qrUrl;
            document.getElementById('qrUrlText').textContent = res.url;
          } else {
            alert(res.message);
            container.classList.add('hidden');
          }
        })
        .withFailureHandler(function(err) {
          alert('QR 코드 생성 오류: ' + err.message);
          container.classList.add('hidden');
        })
        .getQrCodeUrl();
    }

    function showAlert(msg, isSuccess) {
      const alertBox = document.getElementById('statusAlert');
      alertBox.textContent = msg;
      alertBox.className = isSuccess
        ? 'mt-4 p-4 rounded-xl text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 block'
        : 'mt-4 p-4 rounded-xl text-sm font-medium bg-rose-50 text-rose-700 border border-rose-200 block';
      
      setTimeout(() => {
        alertBox.classList.add('hidden');
      }, 5000);
    }
  </script>
</body>
</html>
