<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조선 시대 연표</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ef;--card:#fff;--tx:#1b2b2a;--mut:#587070;--axis:#8aa7a2;--pri:#1f6f6a;--priTx:#fff;--red:#c43d2f;--bd:#c9d9d4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1c;--card:#172629;--tx:#e8f1ef;--mut:#9db5b1;--axis:#4b6764;--pri:#5cc1b8;--priTx:#08201c;--red:#ff7a6b;--bd:#2c4442}}
:root[data-theme="dark"]{--bg:#0f1a1c;--card:#172629;--tx:#e8f1ef;--mut:#9db5b1;--axis:#4b6764;--pri:#5cc1b8;--priTx:#08201c;--red:#ff7a6b;--bd:#2c4442}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:18px;line-height:1.55}
body.open{padding-bottom:340px}
main{max-width:760px;margin:0 auto;padding:14px 14px 30px}
h1{font-size:28px;margin:4px 0}p{margin:0 0 8px}.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 12px}
.seg{display:inline-flex;border:2px solid var(--bd);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;min-height:44px;font-size:16px}
.seg button.on{background:var(--pri);color:var(--priTx)}
#tl{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:18px;overflow:auto}
#tl.h{overflow-y:hidden}#tl.v{height:44vh;min-height:320px}
#trk{position:relative}
.axis{position:absolute;background:var(--axis);border-radius:2px}
.h .axis{left:0;right:0;top:50%;height:4px;margin-top:-2px}.v .axis{top:0;bottom:0;left:50%;width:4px;margin-left:-2px}
.tick{position:absolute;color:var(--mut);font-size:13px;border:0 dashed var(--bd)}
.h .tick{top:0;bottom:0;border-left-width:1px;padding:0 0 4px 4px;display:flex;align-items:flex-end}
.v .tick{left:0;right:0;border-top-width:1px;padding:2px 0 0 4px}
.gap{position:absolute;background:var(--card);color:var(--pri);font-size:14px;padding:0 6px;border-radius:8px;transform:translate(-50%,-50%);white-space:nowrap}
.h .gap{top:50%}.v .gap{left:50%}
.ev{position:absolute;width:26px;height:26px;padding:0;border-radius:50%;background:var(--card);border:4px solid var(--pri);transform:translate(-50%,-50%);z-index:2;transition:background .3s,box-shadow .3s,border-color .3s}
.h .ev{top:50%}.v .ev{left:50%}
.ev .st{position:absolute;background:var(--axis);transition:background .3s}
.ev .cd{position:absolute;width:130px;box-sizing:border-box;padding:6px 8px;background:var(--card);border:2px solid var(--axis);border-radius:12px;font-size:16px;line-height:1.3;text-align:center;transition:border-color .3s,box-shadow .3s}
.v .ev .cd{width:124px}
.cd b{display:block;color:var(--pri);font-size:15px}
.h .a .st{left:50%;bottom:100%;width:2px;height:var(--s);margin-left:-1px}.h .a .cd{left:50%;bottom:calc(100% + var(--s));transform:translateX(-50%)}
.h .b .st{left:50%;top:100%;width:2px;height:var(--s);margin-left:-1px}.h .b .cd{left:50%;top:calc(100% + var(--s));transform:translateX(-50%)}
.v .a .st{top:50%;right:100%;height:2px;width:var(--s);margin-top:-1px}.v .a .cd{right:calc(100% + var(--s));top:50%;transform:translateY(-50%)}
.v .b .st{top:50%;left:100%;height:2px;width:var(--s);margin-top:-1px}.v .b .cd{left:calc(100% + var(--s));top:50%;transform:translateY(-50%)}
.ev.sel{background:var(--red);border-color:var(--red);box-shadow:0 0 0 7px color-mix(in srgb,var(--red) 28%,transparent);z-index:4}
.ev.sel .st{background:var(--red)}.ev.sel .cd{border-color:var(--red);box-shadow:0 3px 12px color-mix(in srgb,var(--red) 35%,transparent)}.ev.sel .cd b{color:var(--red)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:42vh;overflow:auto;background:var(--card);border:2px solid var(--bd);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18);z-index:10}
.sheet[hidden]{display:none}
.yr{color:var(--red);font-size:20px;font-weight:700}.sheet h2{margin:0 0 6px;font-size:26px}
.w{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:16px}
.gp{color:var(--mut);font-size:16px}
.nav{display:flex;gap:10px}.nav button{flex:1;min-height:48px;border:2px solid var(--bd);background:var(--card);border-radius:12px}
.nav button:disabled{opacity:.4;cursor:default}
#x{position:absolute;top:8px;right:10px;width:44px;height:44px;border:0;background:none;font-size:22px}
@media (prefers-reduced-motion:reduce){.ev,.ev .st,.ev .cd{transition:none}}
</style>
</head>
<body>
<main>
<h1>🏯 조선 시대 연표</h1>
<p class="mut">점이나 사건 이름을 눌러서 무슨 일이 있었는지 알아봐요. 점과 점 사이가 멀수록 시간이 더 많이 흐른 거예요.</p>
<div class="ctl">
 <div class="seg" data-g="dir" role="group" aria-label="방향"><button data-v="h">가로</button><button data-v="v">세로</button></div>
 <div class="seg" data-g="gap" role="group" aria-label="간격"><button data-v="1">흐른 시간대로</button><button data-v="0">같은 간격으로</button></div>
 <div class="seg" data-g="cnt" role="group" aria-label="사건 수"><button data-v="1">사건 10개</button><button data-v="0">핵심 6개</button></div>
</div>
<div id="tl"></div>
</main>
<div class="sheet" id="sheet" role="dialog" aria-labelledby="pt" hidden>
 <button id="x" aria-label="닫기">✕</button>
 <div class="yr" id="py"></div><h2 id="pt"></h2><p id="pd"></p><p class="w" id="pw"></p><p class="gp" id="pg"></p>
 <div class="nav"><button id="pv">◀ 앞 사건</button><button id="nx">다음 사건 ▶</button></div>
</div>
<script>
// c:1 이면 "핵심 6개" 보기에도 나옵니다. 같은 해 사건이 여러 개여도 아래 배치 규칙이 알아서 나눠 줍니다.
const EV=[
{y:1392,t:"조선 건국",c:1,d:"이성계 장군이 고려를 대신해 새 나라 조선을 세웠어요. 이후 도읍을 한양(지금의 서울)으로 정했어요.",w:"도읍: 나라의 중심이 되는 도시"},
{y:1418,t:"세종대왕 즉위",c:1,d:"세종이 조선의 네 번째 임금이 되었어요. 백성을 아끼고 과학과 문화를 크게 발전시켰어요.",w:"즉위: 임금 자리에 오르는 것"},
{y:1443,t:"한글 창제",c:1,d:"세종대왕과 학자들이 우리 글자 훈민정음(한글)을 만들었어요. 누구나 쉽게 배워 쓸 수 있는 글자예요.",w:"훈민정음: ‘백성을 가르치는 바른 소리’라는 뜻"},
{y:1592,t:"임진왜란",c:1,d:"일본이 조선에 쳐들어와 7년 동안 전쟁이 이어졌어요. 이순신 장군과 의병이 나라를 지켜 냈어요.",w:"의병: 나라를 지키려고 스스로 일어난 백성"},
{y:1636,t:"병자호란",c:1,d:"청나라가 조선에 쳐들어왔어요. 인조 임금은 남한산성에서 버텼지만 끝내 항복했어요.",w:"항복: 싸움에서 졌다고 인정하는 것"},
{y:1724,t:"영조의 탕평책",c:0,d:"영조 임금은 신하들이 편을 갈라 싸우지 않도록, 고르게 인재를 뽑으려고 했어요.",w:"탕평: 한쪽으로 치우치지 않고 고르다는 뜻"},
{y:1794,t:"수원 화성 축조",c:0,d:"정조 임금이 수원에 튼튼한 화성을 짓기 시작했어요. 정약용이 만든 거중기가 공사를 도왔어요.",w:"거중기: 무거운 돌을 쉽게 들어 올리는 기계"},
{y:1866,t:"병인양요",c:0,d:"프랑스 군대가 강화도에 쳐들어왔어요. 우리 군이 맞서 싸워 물리쳤어요.",w:"양요: 서양 나라와 벌인 싸움"},
{y:1894,t:"동학농민운동",c:0,d:"관리들의 지나친 세금과 횡포에 맞서 농민들이 일어났어요. 전봉준이 농민들을 이끌었어요.",w:"동학: 사람을 하늘처럼 귀하게 여기는 가르침"},
{y:1897,t:"대한제국 선포",c:1,d:"고종이 나라 이름을 대한제국으로 바꾸고 황제가 되었어요. 스스로 힘을 키우는 독립된 나라임을 알렸어요.",w:"황제: 한 나라를 대표하는 가장 높은 임금"}
];
EV.forEach((e,i)=>e.id=i);
const NOW=2026,$=s=>document.querySelector(s),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let H=innerWidth<640?"v":"h",prop=true,all=true,list=[],P=[],selId=-1,si=-1;

function build(){
 list=EV.filter(e=>all||e.c);
 const h=H==="h",ppy=h?5:4,PAD=h?80:70,eq=h?170:120,cw=h?136:70,cs=h?76:126,s0=h?24:20,step=cs+10;
 // ① 간격: 연도 차이에 비례해 위치를 정합니다 (가로 5px, 세로 4px = 1년)
 P=list.map((e,i)=>PAD+(prop?(e.y-list[0].y)*ppy:i*eq));
 const L=P[P.length-1]+PAD,last={a:[],b:[]},pl=[];let ml=0;
 // ② 겹침: 위/아래(세로는 왼/오른쪽)를 번갈아 놓고, 자리가 모자라면 줄기를 더 길게 해서 바깥 줄에 놓습니다
 list.forEach((e,i)=>{
  const o=i%2?["b","a"]:["a","b"];let g=null;
  for(let l=0;l<4&&!g;l++)for(const s of o)if(last[s][l]===undefined||P[i]-last[s][l]>=cw){g=[s,l];break}
  g=g||[o[0],3];last[g[0]][g[1]]=P[i];ml=Math.max(ml,g[1]);pl.push(g);
 });
 const C=Math.max(2*(s0+ml*step+cs)+30,h?300:0),pos=h?"left":"top";let x='<div class="axis"></div>';
 if(prop)for(let y=Math.ceil(list[0].y/100)*100;y<=list[list.length-1].y;y+=100)x+=`<div class="tick" style="${pos}:${PAD+(y-list[0].y)*ppy}px">${y}년</div>`;
 if(prop)for(let i=0;i<list.length-1;i++)if(P[i+1]-P[i]>=(h?70:46))x+=`<span class="gap" style="${pos}:${(P[i]+P[i+1])/2}px">${list[i+1].y-list[i].y}년</span>`;
 list.forEach((e,i)=>x+=`<button class="ev ${pl[i][0]}" data-i="${i}" style="${pos}:${P[i]}px;--s:${s0+pl[i][1]*step}px" aria-label="${e.y}년 ${e.t}"><i class="st"></i><span class="cd"><b>${e.y}년</b>${e.t}</span></button>`);
 const tl=$("#tl");tl.className=H;
 tl.innerHTML=`<div id="trk" style="${h?`width:${L}px;height:${C}px`:`height:${L}px;width:${C}px;min-width:100%`}">${x}</div>`;
 document.querySelectorAll(".seg").forEach(s=>{const v={dir:H,gap:prop?"1":"0",cnt:all?"1":"0"}[s.dataset.g];s.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))});
 si=list.findIndex(e=>e.id===selId);
 if(si<0){selId=-1;close()}else{mark();center(si,true)}
}
function mark(){document.querySelectorAll(".ev").forEach(b=>b.classList.toggle("sel",+b.dataset.i===si))}
function center(i,now){
 const c=$("#tl"),b=now||rm?"auto":"smooth";
 H==="h"?c.scrollTo({left:P[i]-c.clientWidth/2,behavior:b}):c.scrollTo({top:P[i]-c.clientHeight*.35,behavior:b});
}
function pick(i){
 if(i<0||i>=list.length)return;si=i;const e=list[i];selId=e.id;mark();center(i);
 $("#py").textContent=e.y+"년 · 지금부터 약 "+(NOW-e.y)+"년 전";$("#pt").textContent=e.t;$("#pd").textContent=e.d;$("#pw").textContent="📖 "+e.w;
 $("#pg").textContent=i?`앞 사건(${list[i-1].t})에서 ${e.y-list[i-1].y}년 뒤에 일어났어요.`:"연표에서 가장 먼저 일어난 사건이에요.";
 $("#pv").disabled=!i;$("#nx").disabled=i===list.length-1;
 $("#sheet").hidden=false;document.body.classList.add("open");
}
function close(){$("#sheet").hidden=true;document.body.classList.remove("open")}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.classList.contains("ev"))pick(+b.dataset.i);
 else if(b.parentElement.classList.contains("seg")){const g=b.parentElement.dataset.g,v=b.dataset.v;if(g==="dir")H=v;if(g==="gap")prop=v==="1";if(g==="cnt")all=v==="1";build()}
 else if(b.id==="x")close();
 else if(b.id==="pv")pick(si-1);
 else if(b.id==="nx")pick(si+1);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
build();
</script>
</body>
</html>
