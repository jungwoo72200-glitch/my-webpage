<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>객관식 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f3fb;--card:#fff;--tx:#17324a;--mut:#58738a;--pri:#1f6fc5;--priTx:#fff;--ok:#1b8a4d;--okbg:#dff4e8;--no:#c73e3e;--nobg:#fde7e7;--bd:#c5dcee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c29;--card:#182a3a;--tx:#eaf3fb;--mut:#9bb4c8;--pri:#6aaaf0;--priTx:#0b1a28;--ok:#59d08d;--okbg:#15382a;--no:#ff8484;--nobg:#432020;--bd:#2c465d}}
:root[data-theme="dark"]{--bg:#0f1c29;--card:#182a3a;--tx:#eaf3fb;--mut:#9bb4c8;--pri:#6aaaf0;--priTx:#0b1a28;--ok:#59d08d;--okbg:#15382a;--no:#ff8484;--nobg:#432020;--bd:#2c465d}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}
p{margin:0 0 12px;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);border-radius:16px;padding:14px 16px;min-height:56px;text-align:left;width:100%}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.topic{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.topic b{font-size:22px;font-weight:400}.topic small{display:block;color:var(--mut);font-size:15px}
.big{font-size:36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--mut)}
.top button{width:auto;min-height:44px;padding:6px 14px;text-align:center}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:24px;margin:0 0 16px;line-height:1.4}
.opt{margin-bottom:10px}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no);color:var(--no)}
.opt:disabled{cursor:default}
.msg{min-height:32px;font-size:20px;margin:8px 0}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.go{background:var(--pri);color:var(--priTx);border-color:var(--pri);text-align:center;font-size:20px}
.score{font-size:64px;text-align:center;margin:6px 0}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// 문제 형식: [문제, 정답, 오답1, 오답2, 오답3]  (보기 순서는 매번 섞입니다)
// 새 주제는 TOPICS에 항목만 추가하면 됩니다. 문제 수가 10개보다 많을수록 다시 풀기가 다양해집니다.
const TOPICS={
 dokdo:{name:"독도의 날 퀴즈",emoji:"🏝️",desc:"독도에 대해 알아봐요",items:[
  ["독도의 날은 언제일까요?","10월 25일","3월 1일","8월 15일","10월 3일"],
  ["독도는 우리나라의 어느 쪽 끝에 있는 섬일까요?","동쪽","서쪽","남쪽","북쪽"],
  ["독도가 있는 바다의 이름은 무엇일까요?","동해","서해","남해","태평양"],
  ["독도는 크게 어떤 두 섬으로 이루어져 있을까요?","동도와 서도","남도와 북도","상도와 하도","대도와 소도"],
  ["독도가 속한 행정구역(도)은 어디일까요?","경상북도","제주도","강원특별자치도","전라남도"],
  ["독도에서 많이 볼 수 있는 새는 무엇일까요?","괭이갈매기","독수리","참새","펭귄"],
  ["독도와 가장 가까운 큰 섬은 어디일까요?","울릉도","제주도","강화도","거제도"],
  ["조선 시대에 일본에 가서 울릉도와 독도가 우리 땅임을 알린 인물은?","안용복","이순신","세종대왕","김구"],
  ["독도를 지키는 일을 하는 분들은 누구일까요?","독도경비대","소방관","우체부","등대지기 로봇"],
  ["독도에 피는 꽃으로 알려진 것은 무엇일까요?","해국","장미","벚꽃","튤립"],
  ["독도의 날은 어떤 일을 기념해서 정했을까요?","1900년 대한제국 칙령 제41호","한글 창제","광복","삼일 만세 운동"],
  ["독도는 어느 나라의 땅일까요?","대한민국","일본","중국","미국"],
  ["독도의 날에 우리가 할 수 있는 일은?","독도에 대해 배우고 알리기","독도를 모른 척하기","독도에 쓰레기 버리기","독도 이름 바꾸기"],
  ["독도의 이름을 노래로 알린 동요 제목은?","독도는 우리 땅","반달","아리랑 고개","섬집 아기"]]},
 read:{name:"독서 퀴즈",emoji:"📚",desc:"책 읽기에 대해 알아봐요",items:[
  ["책의 제목과 글쓴이가 적혀 있는 곳은?","표지","차례","쪽수","뒷면 가격표"],
  ["책을 읽기 전에 제목을 보고 내용을 짐작하는 것은?","예측하기","베껴 쓰기","빨리 읽기","건너뛰기"],
  ["모르는 낱말이 나오면 가장 먼저 할 일은?","국어사전에서 찾아보기","책을 덮기","그냥 넘어가기","친구에게 책 주기"],
  ["이야기를 이루는 세 가지 요소가 아닌 것은?","가격","인물","사건","배경"],
  ["글쓴이가 글에서 가장 말하고 싶은 생각은?","주제","제목 글씨","쪽수","출판사"],
  ["책을 읽고 느낀 점을 쓴 글은?","독서 감상문","편지 봉투","일기 예보","광고 문구"],
  ["책의 내용을 순서대로 보여 주는 쪽은?","차례","표지","판권","뒷표지"],
  ["긴 글의 내용을 짧게 줄여 말하는 것은?","요약하기","늘여 쓰기","따라 읽기","그림 그리기"],
  ["소리 내지 않고 눈으로만 읽는 방법은?","묵독","낭독","합창","암송"],
  ["책을 빌릴 수 있는 곳은?","도서관","수영장","운동장","주차장"],
  ["토끼와 거북이 이야기가 주는 교훈은?","꾸준히 노력하면 이룰 수 있다","잠은 낮에 자야 한다","빠르면 항상 이긴다","경주는 하지 말아야 한다"],
  ["책을 읽을 때 좋은 자세는?","바른 자세로 밝은 곳에서 읽기","누워서 어두운 곳에서 읽기","걸으면서 읽기","눈 가까이 대고 읽기"]]}
};
const N=10,app=document.getElementById("app");
let qs,idx,score,first,done,topic,sound=true,last={},ac;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(seq){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d,ty])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
const SND={ok:[[660,.12],[880,.2]],no:[[220,.25,"sawtooth"]],end:[[523,.12],[659,.12],[784,.25]]};

function home(){
 app.innerHTML='<h1>🎯 객관식 퀴즈</h1><p>주제를 골라 10문제에 도전해요!</p>'+
 Object.entries(TOPICS).map(([k,t])=>`<button class="card topic" data-t="${k}"><span class="big">${t.emoji}</span><span><b>${t.name}</b><small>${t.desc}</small></span></button>`).join("");
}
function begin(k){
 topic=k;const L=last[k]||new Set();
 // 지난 판에 나온 문제는 뒤로 미뤄서, 새 문제가 먼저 뽑히게 합니다
 const pick=shuffle(TOPICS[k].items.map((x,i)=>({i,x}))).sort((a,b)=>L.has(a.i)-L.has(b.i)).slice(0,N);
 last[k]=new Set(pick.map(p=>p.i));
 qs=pick.map(({x:[q,c,...w]})=>({q,c,o:shuffle([c,...w])}));
 idx=0;score=0;show();
}
function show(){
 const q=qs[idx];first=true;done=false;
 app.innerHTML=`<div class="top"><span>${TOPICS[topic].name} · ${idx+1} / ${qs.length}</span><button id="snd" aria-label="효과음 켜기 끄기">${sound?"🔊":"🔇"}</button></div>
 <div class="bar"><i style="width:${idx/qs.length*100}%"></i></div>
 <div class="card"><p class="q">${q.q}</p>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}
 <div class="msg" id="msg" aria-live="polite"></div><div id="nx"></div></div>`;
}
function pick(i){
 if(done)return;const q=qs[idx],b=app.querySelector(`[data-i="${i}"]`),m=document.getElementById("msg");
 if(b.disabled)return;
 if(q.o[i]===q.c){
  done=true;if(first)score++;b.classList.add("right");
  app.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  m.className="msg ok";m.textContent="🎉 정답이에요!";tone(SND.ok);
  document.getElementById("nx").innerHTML=`<button class="go" id="next">${idx+1<qs.length?"다음 문제":"결과 보기"}</button>`;
  document.getElementById("next").focus();
 }else{
  first=false;b.classList.add("wrong","shake");b.disabled=true;
  m.className="msg no";m.textContent="🤔 다시 생각해보세요";tone(SND.no);
 }
}
function result(){
 tone(SND.end);
 const t=score>=9?"독도 박사님이에요! 🏆":score>=7?"아주 잘했어요! 👏":score>=4?"조금만 더 힘내요! 💪":"괜찮아요, 다시 도전해요! 🌱";
 app.innerHTML=`<div class="card"><p style="text-align:center">최종 점수</p><div class="score">${score} / ${qs.length}</div><p class="q" style="text-align:center">${t}</p>
 <button class="go" data-t="${topic}" style="margin-bottom:10px">다시 풀기 (새로운 문제)</button><button id="home" style="text-align:center">다른 주제 고르기</button></div>`;
}
app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.t)begin(b.dataset.t);
 else if(b.dataset.i!==undefined)pick(+b.dataset.i);
 else if(b.id==="next"){idx++;idx<qs.length?show():result()}
 else if(b.id==="home")home();
 else if(b.id==="snd"){sound=!sound;b.textContent=sound?"🔊":"🔇"}
});
home();
</script>
</body>
</html>
