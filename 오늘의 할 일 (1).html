<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 할 일</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--sub:#6b7280;--line:#e5e7eb;--pri:#4f6bed;--ok:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1e222b;--tx:#e8eaf0;--sub:#9aa3b2;--line:#2c313c;--pri:#7b93ff;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1e222b;--tx:#e8eaf0;--sub:#9aa3b2;--line:#2c313c;--pri:#7b93ff;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar .t{flex:1;font-weight:600;min-width:140px}
button,input,select{font:inherit;color:var(--tx)}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--pri)}
input[type=date],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--sub)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.bar i.full{background:var(--ok)}
.pct{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:6px}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input[type=text]{flex:1;min-width:160px}
.add .go{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li input{width:20px;height:20px;accent-color:var(--pri);cursor:pointer}
li .tx{flex:1;word-break:break-all}
li.done .tx{text-decoration:line-through;color:var(--sub)}
.tag{font-size:12px;color:var(--pri);border:1px solid var(--pri);border-radius:99px;padding:0 8px}
.del{background:none;border:0;color:var(--sub);cursor:pointer;font-size:18px}
.empty{text-align:center;color:var(--sub);padding:18px 0}
.sum{font-size:13px;color:var(--sub);margin-top:4px}
</style>
</head>
<body>
<main>
<h1>📝 오늘의 할 일</h1>

<div class="card">
  <div class="datebar">
    <button class="btn" id="prev" aria-label="전날">◀</button>
    <div class="t" id="title"></div>
    <button class="btn" id="next" aria-label="다음날">▶</button>
    <input type="date" id="pick">
    <button class="btn" id="today">오늘</button>
  </div>
</div>

<div class="card">
  <div class="stats">
    <div><b id="nTotal">0</b><span>전체</span></div>
    <div><b id="nDone">0</b><span>완료</span></div>
    <div><b id="nLeft">0</b><span>남은 일</span></div>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div class="pct"><span id="msg">할 일을 추가해 보세요</span><span id="pct">0%</span></div>
</div>

<div class="card">
  <div class="add">
    <input type="text" id="txt" placeholder="할 일을 입력하세요" maxlength="80">
    <select id="cat"></select>
    <button class="go" id="addBtn">추가</button>
  </div>
</div>

<div class="card">
  <div class="chips" id="chips"></div>
  <ul id="list"></ul>
  <div class="sum" id="sum"></div>
</div>
</main>

<script>
const CATS=['학업','과제','시험','일상','운동','기타'];
const KEY='todo-app-v1';
let tasks=[],cur=ymd(new Date()),filter='전체';
try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function ymd(d){const m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0');return d.getFullYear()+'-'+m+'-'+a}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function shift(n){const d=parse(cur);d.setDate(d.getDate()+n);cur=ymd(d);render()}
const $=id=>document.getElementById(id);

$('cat').innerHTML=CATS.map(c=>'<option>'+c+'</option>').join('');

function render(){
  const d=parse(cur),days=['일','월','화','수','목','금','토'];
  const isToday=cur===ymd(new Date());
  $('title').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+days[d.getDay()]+')'+(isToday?' · 오늘':'');
  $('pick').value=cur;

  const day=tasks.filter(t=>t.date===cur);
  const done=day.filter(t=>t.done).length,total=day.length,left=total-done;
  const p=total?Math.round(done/total*100):0;
  $('nTotal').textContent=total;$('nDone').textContent=done;$('nLeft').textContent=left;
  $('fill').style.width=p+'%';$('fill').className=p===100&&total?'full':'';
  $('pct').textContent=p+'%';
  $('msg').textContent=!total?'할 일을 추가해 보세요':left===0?'🎉 모두 완료했어요!':'남은 일이 '+left+'개 있어요';

  const chips=$('chips');chips.innerHTML='';
  ['전체',...CATS].forEach(c=>{
    const n=c==='전체'?day.length:day.filter(t=>t.cat===c).length;
    const b=document.createElement('button');
    b.className='chip'+(filter===c?' on':'');
    b.textContent=c+' '+n;
    b.onclick=()=>{filter=c;render()};
    chips.appendChild(b);
  });

  const ul=$('list');ul.innerHTML='';
  const shown=day.filter(t=>filter==='전체'||t.cat===filter);
  if(!shown.length){
    const e=document.createElement('div');e.className='empty';
    e.textContent=total?'이 카테고리에는 할 일이 없어요':'등록된 할 일이 없어요';
    ul.appendChild(e);
  }
  shown.forEach(t=>{
    const li=document.createElement('li');if(t.done)li.className='done';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
    cb.onchange=()=>{t.done=cb.checked;save();render()};
    const tx=document.createElement('span');tx.className='tx';tx.textContent=t.text;
    const tg=document.createElement('span');tg.className='tag';tg.textContent=t.cat;
    const x=document.createElement('button');x.className='del';x.textContent='✕';x.setAttribute('aria-label','삭제');
    x.onclick=()=>{tasks=tasks.filter(o=>o.id!==t.id);save();render()};
    li.append(cb,tx,tg,x);ul.appendChild(li);
  });
  $('sum').textContent=filter==='전체'?'':filter+' 카테고리 보기 중';
}

function add(){
  const v=$('txt').value.trim();if(!v)return;
  tasks.push({id:Date.now()+Math.random(),text:v,cat:$('cat').value,done:false,date:cur});
  $('txt').value='';save();render();$('txt').focus();
}
$('addBtn').onclick=add;
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
$('today').onclick=()=>{cur=ymd(new Date());render()};
$('pick').onchange=e=>{if(e.target.value){cur=e.target.value;render()}};
render();
</script>
</body>
</html>
