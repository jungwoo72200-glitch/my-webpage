<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리 반 2D 가상 미술관</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Noto Sans KR Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
    }
    body {
      margin: 0;
      background-color: #1c1917;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    /* 커스텀 스크롤바 */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f5f5f4;
      border-radius: 999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #d6d3d1;
      border-radius: 999px;
    }
    /* 토스트 애니메이션 */
    @keyframes slideDownFade {
      from { opacity: 0; transform: translate(-50%, -16px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .toast-anim {
      animation: slideDownFade 0.25s ease-out forwards;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden bg-stone-900">

  <!-- 상단 다크 우드 네비게이션 바 -->
  <header class="h-14 sm:h-16 bg-[#171310] border-b border-amber-900/40 px-3 sm:px-5 flex items-center justify-between shrink-0 z-20 shadow-lg">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white text-base sm:text-lg shadow-inner shrink-0">
        🖼️
      </div>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <h1 class="text-sm sm:text-lg font-extrabold text-amber-100 truncate">우리 반 2D 가상 미술관</h1>
          <span id="artCountBadge" class="hidden sm:inline-block px-2.5 py-0.5 rounded-full bg-amber-900/50 border border-amber-700/40 text-amber-300 text-xs font-bold shrink-0">
            전시 중 0점
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
      <button onclick="openResetModal()"
        class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-300 text-xs sm:text-sm font-bold transition-colors border border-stone-700">
        🔄 초기화
      </button>
      <button onclick="openUploadModal()"
        class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs sm:text-sm font-extrabold shadow-md shadow-amber-900/40 transition-all">
        + 작품 전시하기
      </button>
    </div>
  </header>

  <!-- 2D 가상 미술관 캔버스 스테이지 -->
  <main class="relative flex-1 w-full overflow-hidden bg-[#26201b]">
    <canvas id="galleryCanvas" class="cursor-pointer"></canvas>

    <!-- 좌측 상단 조작 안내 HUD -->
    <div class="hidden sm:flex items-center gap-2 absolute top-3.5 left-4 bg-stone-950/75 backdrop-blur-md text-amber-50/90 px-3.5 py-2 rounded-xl text-xs font-medium border border-amber-500/20 pointer-events-none shadow-md">
      <span>⌨️ 방향키 / WASD 이동</span>
      <span class="text-amber-500/50">|</span>
      <span>🖱️ 작품 클릭 또는 앞에서 Spacebar 감상</span>
    </div>

    <!-- 모바일용 작품 수 배지 -->
    <div id="mobileArtCount" class="sm:hidden absolute top-3 left-3 bg-stone-950/75 backdrop-blur-md text-amber-300 px-3 py-1 rounded-full text-xs font-bold border border-amber-500/20 pointer-events-none">
      전시 중 0점
    </div>

    <!-- 하단 좌측 터치 D-pad 컨트롤러 -->
    <div class="absolute bottom-4 left-4 grid grid-cols-3 grid-rows-2 gap-1.5 z-10" aria-label="방향 이동 버튼">
      <button data-dir="up" class="dpad-btn col-start-2 row-start-1 w-12 h-12 rounded-xl bg-stone-950/70 hover:bg-stone-800/80 active:bg-amber-600 text-amber-100 border border-amber-200/20 text-lg font-bold flex items-center justify-center shadow-lg backdrop-blur-sm touch-none">▲</button>
      <button data-dir="left" class="dpad-btn col-start-1 row-start-2 w-12 h-12 rounded-xl bg-stone-950/70 hover:bg-stone-800/80 active:bg-amber-600 text-amber-100 border border-amber-200/20 text-lg font-bold flex items-center justify-center shadow-lg backdrop-blur-sm touch-none">◀</button>
      <button data-dir="down" class="dpad-btn col-start-2 row-start-2 w-12 h-12 rounded-xl bg-stone-950/70 hover:bg-stone-800/80 active:bg-amber-600 text-amber-100 border border-amber-200/20 text-lg font-bold flex items-center justify-center shadow-lg backdrop-blur-sm touch-none">▼</button>
      <button data-dir="right" class="dpad-btn col-start-3 row-start-2 w-12 h-12 rounded-xl bg-stone-950/70 hover:bg-stone-800/80 active:bg-amber-600 text-amber-100 border border-amber-200/20 text-lg font-bold flex items-center justify-center shadow-lg backdrop-blur-sm touch-none">▶</button>
    </div>

    <!-- 하단 우측 가까운 작품 감상 버튼 -->
    <button id="inspectFab" onclick="inspectNearest()"
      class="hidden absolute bottom-5 right-4 sm:right-6 px-5 py-3 rounded-full bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-extrabold text-sm shadow-xl shadow-black/40 border-2 border-amber-300/50 transition-all z-10">
      🔍 작품 감상하기
    </button>
  </main>

  <!-- 토스트 알림 컨테이너 -->
  <div id="toastBox" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-stone-900 text-amber-100 text-sm font-bold shadow-2xl border border-amber-500/40 toast-anim">
  </div>

  <!-- ==================== 1. 작품 전시(업로드) 모달 ==================== -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto custom-scroll p-6 shadow-2xl border border-stone-200">
      <div class="flex items-center justify-between pb-4 border-b border-stone-100 mb-5">
        <h2 class="text-lg sm:text-xl font-extrabold text-stone-800">🎨 새 작품 전시하기</h2>
        <button onclick="closeModal('uploadModal')" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold flex items-center justify-center">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label for="upArtist" class="block text-sm font-bold text-stone-700 mb-1.5">작가 이름 (학생 이름) *</label>
          <input type="text" id="upArtist" placeholder="예: 김민수" autocomplete="off"
            class="w-full px-3.5 py-2.5 rounded-xl border-2 border-stone-200 focus:border-amber-500 focus:outline-none text-sm">
        </div>

        <div>
          <label for="upTitle" class="block text-sm font-bold text-stone-700 mb-1.5">작품 제목 *</label>
          <input type="text" id="upTitle" placeholder="예: 노을 지는 우리 학교" autocomplete="off"
            class="w-full px-3.5 py-2.5 rounded-xl border-2 border-stone-200 focus:border-amber-500 focus:outline-none text-sm">
        </div>

        <div>
          <label for="upDesc" class="block text-sm font-bold text-stone-700 mb-1.5">작품 설명 (선택)</label>
          <textarea id="upDesc" rows="2" placeholder="작품을 그리며 느낀 점이나 표현하고 싶었던 내용을 적어주세요."
            class="w-full px-3.5 py-2.5 rounded-xl border-2 border-stone-200 focus:border-amber-500 focus:outline-none text-sm resize-none"></textarea>
        </div>

        <div>
          <label for="upFile" class="block text-sm font-bold text-stone-700 mb-1.5">작품 이미지 업로드 (1MB 이하 자동 압축) *</label>
          <input type="file" id="upFile" accept="image/*" onchange="handleFileSelect(event)"
            class="w-full text-sm text-stone-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
          <div class="mt-3 rounded-2xl border-2 border-dashed border-stone-200 bg-stone-50 p-4 text-center">
            <img id="upPreview" alt="작품 미리보기" class="hidden max-h-48 mx-auto rounded-xl shadow-sm object-contain mb-2">
            <p id="compressInfo" class="text-xs text-stone-500 font-medium">이미지를 선택하면 자동으로 크기를 최적화해 미리보기를 보여줍니다.</p>
          </div>
        </div>

        <button id="uploadSubmitBtn" onclick="submitArtwork()"
          class="w-full py-3.5 rounded-2xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-sm shadow-md transition-colors">
          미술관 벽면에 전시하기
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 2. 작품 확대 감상 & 감상평 모달 ==================== -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-4xl max-h-[92vh] overflow-y-auto custom-scroll p-5 sm:p-7 shadow-2xl border border-stone-200">
      <div class="flex items-center justify-between pb-4 border-b border-stone-100 mb-5">
        <div class="min-w-0 pr-3">
          <h2 id="detailTitle" class="text-lg sm:text-2xl font-extrabold text-stone-800 truncate">작품 제목</h2>
          <p id="detailArtist" class="text-xs sm:text-sm font-bold text-amber-700 mt-0.5"></p>
        </div>
        <button onclick="closeModal('detailModal')" class="w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold flex items-center justify-center shrink-0">✕</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
        <!-- 좌측: 작품 확대 이미지 -->
        <div class="md:col-span-7 flex flex-col">
          <div class="bg-stone-900 rounded-2xl p-4 flex items-center justify-center min-h-[240px] sm:min-h-[340px] shadow-inner border-4 border-amber-900/30">
            <img id="detailImg" alt="확대 작품" class="max-w-full max-h-[420px] rounded-lg shadow-2xl object-contain">
          </div>
          <div class="mt-4 bg-amber-50/70 border border-amber-100 rounded-2xl p-4">
            <span class="text-xs font-extrabold text-amber-800 block mb-1">📌 작가의 말</span>
            <p id="detailDesc" class="text-sm text-stone-700 leading-relaxed"></p>
          </div>
        </div>

        <!-- 우측: 감상평 목록 및 작성 폼 -->
        <div class="md:col-span-5 flex flex-col justify-between bg-stone-50 rounded-2xl p-4 border border-stone-200">
          <div>
            <div class="flex items-center justify-between mb-3">
              <h3 class="text-sm font-extrabold text-stone-800">💬 친구들의 감상평</h3>
              <span id="detailCmtCount" class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-bold">0개</span>
            </div>

            <div id="commentList" class="space-y-2.5 max-h-[250px] overflow-y-auto custom-scroll pr-1 mb-4">
              <!-- 댓글 렌더링 -->
            </div>
          </div>

          <div class="pt-3 border-t border-stone-200 space-y-2">
            <input type="text" id="cmtAuthor" placeholder="내 이름 (예: 이서연)" autocomplete="off"
              class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white focus:border-amber-500 focus:outline-none text-sm">
            <textarea id="cmtText" rows="2" placeholder="작품을 보고 느낀 점을 따뜻하게 남겨보세요!"
              class="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white focus:border-amber-500 focus:outline-none text-sm resize-none"></textarea>
            <button onclick="submitComment()"
              class="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm shadow-sm transition-colors">
              감상평 등록하기
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 3. 데이터 초기화 확인 모달 ==================== -->
  <div id="resetModal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-3">⚠️</div>
      <h3 class="text-lg font-extrabold text-stone-800 mb-1.5">미술관 데이터를 초기화할까요?</h3>
      <p class="text-xs sm:text-sm text-stone-500 leading-relaxed mb-6">
        직접 올린 작품과 감상평이 모두 삭제되고 기본 샘플 작품 3점으로 되돌아갑니다.
      </p>
      <div class="grid grid-cols-2 gap-2.5">
        <button onclick="closeModal('resetModal')" class="py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-sm">취소</button>
        <button onclick="confirmResetGallery()" class="py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm">초기화</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
     * 1. 상수 및 기본 샘플 작품(Canvas 일러스트) 생성기
     * ===================================================================== */
    const STORAGE_KEY = 'class_2d_virtual_gallery_v1';

    /**
     * 샘플 일러스트 3종을 HTML5 Canvas로 직접 그려 Data URL로 반환
     */
    function createSampleIllustration(type) {
      const c = document.createElement('canvas');
      c.width = 480;
      c.height = 360;
      const g = c.getContext('2d');

      if (type === 'sunset') {
        // 1. 노을 지는 우리 학교
        const sky = g.createLinearGradient(0, 0, 0, 260);
        sky.addColorStop(0, '#312e81');
        sky.addColorStop(0.45, '#db2777');
        sky.addColorStop(0.8, '#f97316');
        sky.addColorStop(1, '#fde047');
        g.fillStyle = sky;
        g.fillRect(0, 0, 480, 360);

        // 태양
        g.fillStyle = '#fef08a';
        g.beginPath();
        g.arc(360, 145, 42, 0, Math.PI * 2);
        g.fill();

        // 구름
        g.fillStyle = 'rgba(255,255,255,0.28)';
        g.beginPath();
        g.roundRect(60, 65, 110, 22, 11);
        g.roundRect(190, 95, 90, 18, 9);
        g.fill();

        // 운동장 땅
        g.fillStyle = '#78350f';
        g.fillRect(0, 260, 480, 100);

        // 학교 건물 실루엣
        g.fillStyle = '#1e1b4b';
        g.fillRect(70, 155, 250, 105);
        g.fillRect(160, 120, 70, 35); // 시계탑

        // 시계
        g.fillStyle = '#fef3c7';
        g.beginPath();
        g.arc(195, 138, 10, 0, Math.PI * 2);
        g.fill();

        // 창문 불빛
        g.fillStyle = '#fcd34d';
        for (let r = 0; r < 2; r++) {
          for (let col = 0; col < 6; col++) {
            g.fillRect(88 + col * 37, 172 + r * 38, 22, 24);
          }
        }
      } else if (type === 'space_cat') {
        // 2. 우주를 여행하는 고양이
        const bg = g.createLinearGradient(0, 0, 480, 360);
        bg.addColorStop(0, '#090d16');
        bg.addColorStop(0.5, '#1e1b4b');
        bg.addColorStop(1, '#312e81');
        g.fillStyle = bg;
        g.fillRect(0, 0, 480, 360);

        // 별들
        g.fillStyle = '#ffffff';
        const stars = [[40,50],[120,30],[220,70],[390,45],[430,130],[80,220],[380,260],[160,310],[300,320],[440,300]];
        stars.forEach(([sx, sy], i) => {
          g.beginPath();
          g.arc(sx, sy, (i % 3) + 1.5, 0, Math.PI * 2);
          g.fill();
        });

        // 토성 행성
        g.fillStyle = '#f59e0b';
        g.beginPath();
        g.arc(105, 115, 34, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = '#fde68a';
        g.lineWidth = 5;
        g.beginPath();
        g.ellipse(105, 115, 60, 14, -0.25, 0, Math.PI * 2);
        g.stroke();

        // 우주 헬멧 쓴 고양이
        const cx = 270, cy = 195;
        // 우주복 몸통
        g.fillStyle = '#e2e8f0';
        g.beginPath();
        g.roundRect(cx - 38, cy + 32, 76, 70, 22);
        g.fill();
        g.fillStyle = '#ef4444';
        g.fillRect(cx - 18, cy + 52, 36, 18);

        // 헬멧 유리
        g.fillStyle = 'rgba(186, 230, 253, 0.25)';
        g.strokeStyle = '#94a3b8';
        g.lineWidth = 6;
        g.beginPath();
        g.arc(cx, cy, 56, 0, Math.PI * 2);
        g.fill();
        g.stroke();

        // 고양이 얼굴
        g.fillStyle = '#fb923c';
        g.beginPath();
        g.arc(cx, cy + 4, 34, 0, Math.PI * 2);
        g.fill();
        // 귀
        g.beginPath();
        g.moveTo(cx - 28, cy - 12); g.lineTo(cx - 18, cy - 38); g.lineTo(cx - 4, cy - 22);
        g.moveTo(cx + 28, cy - 12); g.lineTo(cx + 18, cy - 38); g.lineTo(cx + 4, cy - 22);
        g.fill();
        // 눈과 코
        g.fillStyle = '#1e293b';
        g.beginPath();
        g.arc(cx - 12, cy, 4, 0, Math.PI * 2);
        g.arc(cx + 12, cy, 4, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = '#f43f5e';
        g.beginPath();
        g.arc(cx, cy + 8, 3.5, 0, Math.PI * 2);
        g.fill();
      } else {
        // 3. 봄날의 벚꽃 길
        const sky = g.createLinearGradient(0, 0, 0, 250);
        sky.addColorStop(0, '#bae6fd');
        sky.addColorStop(1, '#fce7f3');
        g.fillStyle = sky;
        g.fillRect(0, 0, 480, 360);

        // 잔디 언덕
        g.fillStyle = '#86efac';
        g.fillRect(0, 230, 480, 130);

        // 산책로 길
        g.fillStyle = '#fef3c7';
        g.beginPath();
        g.moveTo(210, 230);
        g.lineTo(270, 230);
        g.lineTo(360, 360);
        g.lineTo(120, 360);
        g.closePath();
        g.fill();

        // 벚나무 기둥
        g.fillStyle = '#78350f';
        g.fillRect(85, 145, 22, 115);
        g.fillRect(375, 140, 24, 120);

        // 벚꽃 잎 뭉치
        const blobs = [
          [95, 120, 52], [55, 135, 38], [135, 135, 42],
          [385, 115, 55], [340, 135, 42], [430, 135, 38]
        ];
        blobs.forEach(([bx, by, r]) => {
          g.fillStyle = '#fbcfe8';
          g.beginPath();
          g.arc(bx, by, r, 0, Math.PI * 2);
          g.fill();
          g.fillStyle = '#f9a8d4';
          g.beginPath();
          g.arc(bx - 10, by - 8, r * 0.65, 0, Math.PI * 2);
          g.fill();
        });

        // 흩날리는 꽃잎
        g.fillStyle = '#f472b6';
        const petals = [[180,90],[240,120],[290,85],[210,170],[275,195],[160,260],[310,275],[235,300]];
        petals.forEach(([px, py]) => {
          g.beginPath();
          g.ellipse(px, py, 5, 3, 0.5, 0, Math.PI * 2);
          g.fill();
        });
      }

      return c.toDataURL('image/jpeg', 0.85);
    }

    function getDefaultArtworks() {
      return [
        {
          id: 'sample-1',
          artist: '김민수',
          title: '노을 지는 우리 학교',
          description: '방과 후 운동장에서 바라본 붉은 노을과 학교 시계탑이 너무 예뻐서 수채화 느낌으로 그려보았어요.',
          createdAt: '2026-11-20 14:10',
          imageData: createSampleIllustration('sunset'),
          comments: [
            { id: 'c1', author: '이서연', text: '하늘 색깔이 진짜 노을 같아요! 창문 불빛 표현이 멋져요.', createdAt: '2026-11-20 14:25' },
            { id: 'c2', author: '담임선생님', text: '따뜻한 색감 덕분에 학교가 더 아늑해 보이네요. 참 잘 그렸어요!', createdAt: '2026-11-20 15:02' }
          ]
        },
        {
          id: 'sample-2',
          artist: '이서연',
          title: '우주를 여행하는 고양이',
          description: '우리 집 고양이 치즈가 우주복을 입고 토성 옆을 날아가는 상상을 하며 그렸습니다.',
          createdAt: '2026-11-20 14:30',
          imageData: createSampleIllustration('space_cat'),
          comments: [
            { id: 'c3', author: '박지훈', text: '고양이가 헬멧 쓴 게 너무 귀여워요 ㅋㅋ 토성 고리도 디테일해요!', createdAt: '2026-11-20 14:40' }
          ]
        },
        {
          id: 'sample-3',
          artist: '박지훈',
          title: '봄날의 벚꽃 길',
          description: '지난봄에 가족들과 걸었던 공원 벚꽃 길을 떠올리며 분홍빛 꽃잎이 흩날리는 장면을 담았어요.',
          createdAt: '2026-11-20 14:55',
          imageData: createSampleIllustration('cherry'),
          comments: [
            { id: 'c4', author: '김민수', text: '꽃잎이 바람에 날리는 느낌이 잘 살았어요! 봄이 빨리 왔으면 좋겠다.', createdAt: '2026-11-20 15:12' }
          ]
        }
      ];
    }

    /* =====================================================================
     * 2. 상태 관리 및 localStorage 연동
     * ===================================================================== */
    const canvas = document.getElementById('galleryCanvas');
    const ctx = canvas.getContext('2d');

    let artworks = [];
    const imageCache = {};
    let selectedArtwork = null;
    let nearestArtwork = null;
    let compressedBase64 = '';
    let toastTimer = null;

    // 2D 미술관 레이아웃 상수
    const FRAME_W = 200;
    const FRAME_H = 148;
    const FRAME_GAP = 100;
    const START_X = 130;
    const WALL_HEIGHT = 285;

    let worldWidth = 1400;
    let cameraX = 0;

    // 2D 아바타 상태
    const player = {
      x: 180,
      y: 380,
      speed: 4.4,
      dir: 'down',
      walkTick: 0,
      moving: false
    };

    const keys = { up: false, down: false, left: false, right: false };

    function loadArtworksFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const defaults = getDefaultArtworks();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
          return defaults;
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || parsed.length === 0) {
          const defaults = getDefaultArtworks();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
          return defaults;
        }
        return parsed;
      } catch (e) {
        return getDefaultArtworks();
      }
    }

    function saveArtworksToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(artworks));
      } catch (e) {
        showToast('저장 공간이 부족해 일부 데이터가 저장되지 않았습니다.');
      }
    }

    function formatNow() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    function syncGalleryMetadata() {
      const countText = `전시 중 ${artworks.length}점`;
      document.getElementById('artCountBadge').textContent = countText;
      document.getElementById('mobileArtCount').textContent = countText;

      // 작품 수에 따라 복도 가로 폭 자동 확장
      worldWidth = Math.max(canvas.width, START_X + artworks.length * (FRAME_W + FRAME_GAP) + 220);

      // 이미지 캐시 로드
      artworks.forEach(art => {
        if (!imageCache[art.id] && art.imageData) {
          const img = new Image();
          img.src = art.imageData;
          imageCache[art.id] = img;
        }
      });
    }

    /* =====================================================================
     * 3. 캔버스 리사이즈 및 입력 이벤트
     * ===================================================================== */
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      const minY = WALL_HEIGHT + 30;
      const maxY = Math.max(minY + 40, canvas.height - 55);
      player.y = Math.min(Math.max(player.y, minY), maxY);
      worldWidth = Math.max(canvas.width, START_X + artworks.length * (FRAME_W + FRAME_GAP) + 220);
    }
    window.addEventListener('resize', resizeCanvas);

    // 키보드 입력
    window.addEventListener('keydown', e => {
      if (isAnyModalOpen()) {
        if (e.key === 'Escape') {
          closeModal('uploadModal');
          closeModal('detailModal');
          closeModal('resetModal');
        }
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;

      if ((e.key === ' ' || e.key === 'Enter') && nearestArtwork) {
        e.preventDefault();
        openDetailModal(nearestArtwork);
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // 모바일/태블릿 터치 D-pad 바인딩
    document.querySelectorAll('.dpad-btn').forEach(btn => {
      const dir = btn.dataset.dir;
      const setDir = val => { keys[dir] = val; };
      btn.addEventListener('pointerdown', e => { e.preventDefault(); setDir(true); });
      btn.addEventListener('pointerup', () => setDir(false));
      btn.addEventListener('pointerleave', () => setDir(false));
      btn.addEventListener('pointercancel', () => setDir(false));
    });

    // 캔버스 클릭으로 벽면 작품 바로 감상
    canvas.addEventListener('click', e => {
      if (isAnyModalOpen()) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) + cameraX;
      const clickY = e.clientY - rect.top;

      for (let i = 0; i < artworks.length; i++) {
        const fx = START_X + i * (FRAME_W + FRAME_GAP);
        const fy = 78;
        if (clickX >= fx - 14 && clickX <= fx + FRAME_W + 14 && clickY >= fy - 14 && clickY <= fy + FRAME_H + 46) {
          openDetailModal(artworks[i]);
          return;
        }
      }
    });

    /* =====================================================================
     * 4. 2D 가상 미술관 업데이트 & 렌더링 루프
     * ===================================================================== */
    function update() {
      let dx = 0, dy = 0;
      if (!isAnyModalOpen()) {
        if (keys.left) { dx -= 1; player.dir = 'left'; }
        if (keys.right) { dx += 1; player.dir = 'right'; }
        if (keys.up) { dy -= 1; player.dir = 'up'; }
        if (keys.down) { dy += 1; player.dir = 'down'; }
      }

      player.moving = (dx !== 0 || dy !== 0);
      if (player.moving) {
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
        player.walkTick += 0.24;
      }

      // 바닥 이동 영역 제한
      const minY = WALL_HEIGHT + 30;
      const maxY = Math.max(minY + 40, canvas.height - 55);
      player.x = Math.max(44, Math.min(worldWidth - 44, player.x));
      player.y = Math.max(minY, Math.min(maxY, player.y));

      // 카메라 부드러운 추적
      const maxCam = Math.max(0, worldWidth - canvas.width);
      const targetCamX = Math.max(0, Math.min(maxCam, player.x - canvas.width / 2));
      cameraX += (targetCamX - cameraX) * 0.12;

      // 가장 가까운 작품 탐색
      let closest = null;
      let minDist = 145;
      artworks.forEach((art, i) => {
        const centerX = START_X + i * (FRAME_W + FRAME_GAP) + FRAME_W / 2;
        const dist = Math.hypot(player.x - centerX, player.y - (WALL_HEIGHT + 52));
        if (dist < minDist) {
          minDist = dist;
          closest = art;
        }
      });
      nearestArtwork = closest;

      const fab = document.getElementById('inspectFab');
      if (nearestArtwork) {
        const shortName = nearestArtwork.title.length > 10 ? nearestArtwork.title.slice(0, 10) + '…' : nearestArtwork.title;
        fab.textContent = `🔍 "${shortName}" 감상`;
        fab.classList.remove('hidden');
      } else {
        fab.classList.add('hidden');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 크림색 미술관 벽면
      const wallGrad = ctx.createLinearGradient(0, 0, 0, WALL_HEIGHT);
      wallGrad.addColorStop(0, '#f7f2e8');
      wallGrad.addColorStop(1, '#e8dfd0');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, canvas.width, WALL_HEIGHT);

      // 천장 레일 조명 바
      ctx.fillStyle = '#292524';
      ctx.fillRect(0, 0, canvas.width, 12);

      // 하단 우드 몰딩 (걸레받이)
      ctx.fillStyle = '#4a3222';
      ctx.fillRect(0, WALL_HEIGHT - 16, canvas.width, 16);
      ctx.fillStyle = '#6b4730';
      ctx.fillRect(0, WALL_HEIGHT - 16, canvas.width, 3);

      // 2. 따뜻한 원목 바닥
      const floorGrad = ctx.createLinearGradient(0, WALL_HEIGHT, 0, canvas.height);
      floorGrad.addColorStop(0, '#c6a276');
      floorGrad.addColorStop(1, '#9b7448');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, WALL_HEIGHT, canvas.width, canvas.height - WALL_HEIGHT);

      // 원목 마루 가로선
      ctx.strokeStyle = 'rgba(74, 50, 34, 0.16)';
      ctx.lineWidth = 1;
      for (let y = WALL_HEIGHT + 34; y < canvas.height; y += 38) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(-cameraX, 0);

      // 3. 벽면 작품 액자 렌더링
      artworks.forEach((art, i) => {
        const fx = START_X + i * (FRAME_W + FRAME_GAP);
        const fy = 78;
        const isNear = nearestArtwork && nearestArtwork.id === art.id;

        // 천장 스포트라이트 원뿔 조명
        const lightGrad = ctx.createRadialGradient(fx + FRAME_W / 2, 18, 12, fx + FRAME_W / 2, fy + 65, 175);
        lightGrad.addColorStop(0, isNear ? 'rgba(254, 240, 138, 0.52)' : 'rgba(255, 251, 235, 0.30)');
        lightGrad.addColorStop(1, 'rgba(255, 251, 235, 0)');
        ctx.fillStyle = lightGrad;
        ctx.beginPath();
        ctx.moveTo(fx + FRAME_W / 2 - 18, 12);
        ctx.lineTo(fx + FRAME_W / 2 + 18, 12);
        ctx.lineTo(fx + FRAME_W + 48, WALL_HEIGHT - 16);
        ctx.lineTo(fx - 48, WALL_HEIGHT - 16);
        ctx.closePath();
        ctx.fill();

        // 액자 그림자
        ctx.fillStyle = 'rgba(28, 25, 23, 0.24)';
        ctx.fillRect(fx - 5, fy - 3, FRAME_W + 18, FRAME_H + 18);

        // 외부 액자 프레임 (가까이 오면 골드 강조)
        ctx.fillStyle = isNear ? '#d97706' : '#3f2a1d';
        ctx.fillRect(fx - 10, fy - 10, FRAME_W + 20, FRAME_H + 20);

        // 내부 흰색 매트 보드
        ctx.fillStyle = '#fafaf9';
        ctx.fillRect(fx - 3, fy - 3, FRAME_W + 6, FRAME_H + 6);

        // 작품 이미지
        const img = imageCache[art.id];
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, fx, fy, FRAME_W, FRAME_H);
        } else {
          ctx.fillStyle = '#e7e5e4';
          ctx.fillRect(fx, fy, FRAME_W, FRAME_H);
        }

        // 하단 작품 명패
        ctx.fillStyle = '#1c1917';
        ctx.beginPath();
        ctx.roundRect(fx + 14, fy + FRAME_H + 16, FRAME_W - 28, 24, 5);
        ctx.fill();
        ctx.strokeStyle = '#b45309';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#fef3c7';
        ctx.font = '700 11.5px "Noto Sans KR"';
        ctx.textAlign = 'center';
        const shortTitle = art.title.length > 9 ? art.title.slice(0, 9) + '…' : art.title;
        ctx.fillText(`${shortTitle} · ${art.artist}`, fx + FRAME_W / 2, fy + FRAME_H + 32);

        // 가까이 갔을 때 상호작용 말풍선
        if (isNear) {
          ctx.fillStyle = '#d97706';
          ctx.beginPath();
          ctx.roundRect(fx + FRAME_W / 2 - 62, fy - 42, 124, 26, 13);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = '700 11.5px "Noto Sans KR"';
          ctx.fillText('클릭 / Space 감상', fx + FRAME_W / 2, fy - 25);
        }
      });

      // 4. 2D 아바타 캐릭터 렌더링
      drawAvatar(player.x, player.y);

      ctx.restore();
    }

    function drawAvatar(x, y) {
      const legSwing = player.moving ? Math.sin(player.walkTick) * 6 : 0;

      // 바닥 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(x, y + 22, 16, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 다리
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 6, y + 8);
      ctx.lineTo(x - 6 - legSwing * 0.55, y + 20);
      ctx.moveTo(x + 6, y + 8);
      ctx.lineTo(x + 6 + legSwing * 0.55, y + 20);
      ctx.stroke();

      // 상의 (네이비 가디건)
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(x - 13, y - 14, 26, 24, 8);
      ctx.fill();

      // 얼굴
      ctx.fillStyle = '#fde68a';
      ctx.beginPath();
      ctx.arc(x, y - 26, 14, 0, Math.PI * 2);
      ctx.fill();

      // 머리카락
      ctx.fillStyle = '#292524';
      ctx.beginPath();
      ctx.arc(x, y - 29, 14, Math.PI, Math.PI * 2);
      ctx.fill();

      // 눈 (바라보는 방향 반영)
      if (player.dir !== 'up') {
        const eyeOffset = player.dir === 'left' ? -4 : (player.dir === 'right' ? 4 : 0);
        ctx.fillStyle = '#111827';
        ctx.beginPath();
        ctx.arc(x - 4 + eyeOffset, y - 25, 2, 0, Math.PI * 2);
        ctx.arc(x + 4 + eyeOffset, y - 25, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    /* =====================================================================
     * 5. 작품 업로드 & Canvas API 이미지 자동 압축 (1MB 이하)
     * ===================================================================== */
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          compressedBase64 = compressImage(img);
          const kb = Math.max(1, Math.round((compressedBase64.length * 3) / 4 / 1024));
          const preview = document.getElementById('upPreview');
          preview.src = compressedBase64;
          preview.classList.remove('hidden');
          document.getElementById('compressInfo').textContent = `✅ 압축 완료: 약 ${kb}KB (전시 가능)`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function compressImage(img) {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      let maxDim = 800;
      let quality = 0.8;
      let dataUrl = '';

      // 1MB 이하(localStorage 친화적인 약 150KB 이내)로 자동 최적화
      for (let attempt = 0; attempt < 6; attempt++) {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        offCanvas.width = Math.round(img.width * scale);
        offCanvas.height = Math.round(img.height * scale);
        offCtx.clearRect(0, 0, offCanvas.width, offCanvas.height);
        offCtx.drawImage(img, 0, 0, offCanvas.width, offCanvas.height);

        dataUrl = offCanvas.toDataURL('image/jpeg', quality);
        if (dataUrl.length <= 200000) break;

        quality -= 0.12;
        maxDim = Math.round(maxDim * 0.82);
      }
      return dataUrl;
    }

    function submitArtwork() {
      const artist = document.getElementById('upArtist').value.trim();
      const title = document.getElementById('upTitle').value.trim();
      const description = document.getElementById('upDesc').value.trim();

      if (!artist || !title) {
        showToast('작가 이름과 작품 제목을 모두 입력해 주세요.');
        return;
      }
      if (!compressedBase64) {
        showToast('전시할 작품 이미지를 선택해 주세요.');
        return;
      }

      const newArt = {
        id: 'art-' + Date.now(),
        artist,
        title,
        description: description || '작품 설명이 등록되지 않았습니다.',
        createdAt: formatNow(),
        imageData: compressedBase64,
        comments: []
      };

      artworks.push(newArt);
      saveArtworksToStorage();
      syncGalleryMetadata();

      // 폼 초기화
      document.getElementById('upArtist').value = '';
      document.getElementById('upTitle').value = '';
      document.getElementById('upDesc').value = '';
      document.getElementById('upFile').value = '';
      document.getElementById('upPreview').classList.add('hidden');
      document.getElementById('compressInfo').textContent = '이미지를 선택하면 자동으로 크기를 최적화해 미리보기를 보여줍니다.';
      compressedBase64 = '';

      closeModal('uploadModal');
      showToast(`🎨 "${title}" 작품이 미술관 벽면에 전시되었습니다!`);
    }

    /* =====================================================================
     * 6. 작품 상세 감상 및 실시간 감상평 저장
     * ===================================================================== */
    function openDetailModal(art) {
      selectedArtwork = art;
      document.getElementById('detailTitle').textContent = art.title;
      document.getElementById('detailArtist').textContent = `작가: ${art.artist} · 등록일: ${art.createdAt}`;
      document.getElementById('detailImg').src = art.imageData;
      document.getElementById('detailDesc').textContent = art.description || '작품 설명이 등록되지 않았습니다.';
      renderComments(art.comments || []);
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function inspectNearest() {
      if (nearestArtwork) openDetailModal(nearestArtwork);
    }

    function renderComments(list) {
      document.getElementById('detailCmtCount').textContent = `${list.length}개`;
      const container = document.getElementById('commentList');

      if (!list.length) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-stone-400 font-medium">아직 감상평이 없어요. 첫 번째 감상평을 남겨보세요!</div>`;
        return;
      }

      container.innerHTML = list.map(c => `
        <div class="bg-white rounded-xl p-3 border border-stone-200 shadow-sm">
          <div class="flex items-center justify-between text-xs mb-1">
            <strong class="text-stone-800">${escapeHtml(c.author)}</strong>
            <span class="text-stone-400 text-[11px]">${escapeHtml(c.createdAt)}</span>
          </div>
          <p class="text-xs sm:text-sm text-stone-600 leading-snug">${escapeHtml(c.text)}</p>
        </div>
      `).join('');
    }

    function submitComment() {
      if (!selectedArtwork) return;
      const author = document.getElementById('cmtAuthor').value.trim();
      const text = document.getElementById('cmtText').value.trim();

      if (!author || !text) {
        showToast('이름과 감상평을 모두 입력해 주세요.');
        return;
      }

      const newComment = {
        id: 'cmt-' + Date.now(),
        author,
        text,
        createdAt: formatNow()
      };

      selectedArtwork.comments.unshift(newComment);
      saveArtworksToStorage();
      renderComments(selectedArtwork.comments);

      document.getElementById('cmtText').value = '';
      showToast('💬 감상평이 등록되었습니다!');
    }

    /* =====================================================================
     * 7. 모달 및 초기화 유틸리티
     * ===================================================================== */
    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function openResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }

    function confirmResetGallery() {
      localStorage.removeItem(STORAGE_KEY);
      artworks = loadArtworksFromStorage();
      Object.keys(imageCache).forEach(k => delete imageCache[k]);
      syncGalleryMetadata();
      player.x = 180;
      cameraX = 0;
      closeModal('resetModal');
      showToast('🔄 미술관이 기본 샘플 작품 3점으로 초기화되었습니다.');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      if (id === 'detailModal') selectedArtwork = null;
    }

    function isAnyModalOpen() {
      return !document.getElementById('uploadModal').classList.contains('hidden') ||
             !document.getElementById('detailModal').classList.contains('hidden') ||
             !document.getElementById('resetModal').classList.contains('hidden');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 앱 시작
    window.onload = () => {
      artworks = loadArtworksFromStorage();
      resizeCanvas();
      syncGalleryMetadata();
      gameLoop();
    };
  </script>
</body>
</html>
